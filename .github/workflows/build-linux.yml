name: Build Linux AppImage

# Linux can't be built on the Windows/Mac dev boxes (PyInstaller is per-OS), so the
# Linux x86_64 AppImage is produced here on a GitHub-hosted Ubuntu runner and uploaded
# to the chosen release. Run it manually from the Actions tab (workflow_dispatch).
#
# NOTE: proven end-to-end 2026-06-10 — run 27257694787 built and uploaded the v0.1.0
# AppImage. See dev/build_desktop.sh + dev/build_appimage.sh for the underlying build.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the AppImage to"
        required: true
        default: "v0.1.0" # update when cutting a release

permissions:
  contents: write

jobs:
  linux-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the release tag exists (fail fast, before the build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          # A missing/typo'd tag would otherwise surface only at the final upload
          # step, after the whole build — abort loudly up front instead.
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null
          echo "release ${TAG} exists — proceeding"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt            # PyYAML (runtime config)
          pip install Pillow pyinstaller==6.20.0      # PIL (cover rendering) + pinned PyInstaller
          # pywebview is intentionally NOT installed for the Linux build: it pulls in
          # the finicky GTK/WebKit native stack, and the launcher's `import webview`
          # is wrapped in try/except — so the Linux build runs in web/browser mode
          # (PyInstaller just warns about the unused 'webview' hidden import).

      - name: Build desktop binary (PyInstaller)
        run: |
          chmod +x dev/build_desktop.sh
          PYTHON="$(which python)" bash dev/build_desktop.sh

      - name: Fetch appimagetool (pinned release + checksum)
        run: |
          ARCH="$(uname -m)"
          # Pinned versioned release (was: the rolling `continuous` tag) + checksum,
          # so an upstream change is a loud failure here, never a silent new binary.
          # On a version bump, update BOTH lines (digest from the GitHub release API).
          APPIMAGETOOL_VERSION="1.9.1"
          APPIMAGETOOL_SHA256="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0" # x86_64
          curl -fL -o "/tmp/appimagetool-${ARCH}.AppImage" \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-${ARCH}.AppImage"
          echo "${APPIMAGETOOL_SHA256}  /tmp/appimagetool-${ARCH}.AppImage" | sha256sum --check
          chmod +x "/tmp/appimagetool-${ARCH}.AppImage"

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"   # GitHub runners have no FUSE
        run: |
          chmod +x dev/build_appimage.sh
          bash dev/build_appimage.sh

      - name: Upload AppImage + merge its checksum into the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          APPIMAGE="$(ls dist/YHWH-*-x86_64.AppImage | head -n1)"
          BASENAME="$(basename "$APPIMAGE")"
          HASH="$(sha256sum "$APPIMAGE" | awk '{print $1}')"
          echo "AppImage: $BASENAME  ($HASH)"
          # Merge the AppImage line into the release's existing SHA256SUMS.txt
          gh release download "$TAG" -p SHA256SUMS.txt -O SHA256SUMS.txt --clobber || true
          grep -v "  ${BASENAME}\$" SHA256SUMS.txt 2>/dev/null > sums.tmp || true
          echo "${HASH}  ${BASENAME}" >> sums.tmp
          sort -u sums.tmp -o SHA256SUMS.txt
          gh release upload "$TAG" "$APPIMAGE" SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
