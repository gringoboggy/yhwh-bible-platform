# ω.47 — SonarCloud project configuration (2026-05-11).
#
# Read by the SonarScanner CLI (`sonar-scanner` — a separate tool
# from sonar-cli) and by `scripts/check_sonarqube.py` which queries
# the SonarCloud quality-gate REST API. The CI workflow (.github/
# workflows/ci.yml) can optionally invoke SonarScanner; the
# /preflight dashboard renders the current gate status either way.
#
# Project not yet created on SonarCloud? Run:
#   1. Visit https://sonarcloud.io/projects/create
#   2. Import this repo from GitHub (bridge4kaladin-collab/yhwh-bible-platform)
#   3. Confirm the projectKey matches the value below
#   4. Run `sonar-scanner` from this directory to populate the gate
# Until those steps run, `scripts/check_sonarqube.py` returns warn
# ("project not yet created" / "no analysis yet") and /preflight
# surfaces the same — gracefully, not blocking.

sonar.organization=bridge4kaladin-collab
sonar.projectKey=bridge4kaladin-collab_yhwh-bible-platform
sonar.projectName=YHWH Bible Platform
sonar.projectVersion=1.1

# Source layout — only the Python production tree, not data files.
# content/notes/*.py is data (long HTML body tuples per the
# pyproject.toml per-file-ignores), excluded.
sonar.sources=scripts
sonar.tests=tests

sonar.python.version=3.10,3.11,3.12,3.13,3.14

# What NOT to analyze. Mirrors .gitignore + pyproject.toml's
# ruff `extend-exclude` so static analysis matches code review.
sonar.exclusions=\
    **/__pycache__/**,\
    **/*.pyc,\
    **/.backups/**,\
    content/notes/**,\
    content/translations/**,\
    content/sources/**,\
    content/candidates/**,\
    epub_working/**,\
    exports/**,\
    builds/**,\
    kings_session/**,\
    source_archive/**,\
    assets/**,\
    _audit_state.json

sonar.test.exclusions=\
    tests/fixtures.py

# SCM — required for per-line blame on issues.
sonar.scm.provider=git

# Encoding — the project is UTF-8 throughout (memory: PYTHONUTF8=1).
sonar.sourceEncoding=UTF-8
