# SonarCloud project configuration.
#
# Read by the SonarScanner CLI (`sonar-scanner` — separate from the
# `sonar` CLI which uses Auto Analysis) and by any tooling that
# queries SonarCloud's quality-gate REST API. Auto Analysis is
# enabled on the SonarCloud project, so pushes to GitHub trigger
# scans server-side and this file is not load-bearing for normal
# operation — kept canonical for: (a) discoverability of the project
# key, (b) feature-branch scans when Auto Analysis is off, (c)
# SonarLint connected-mode auto-binding in IDEs.

sonar.organization=bridge4kaladin-collab
sonar.projectKey=bridge4kaladin-collab_yhwh-bible-platform
sonar.projectName=YHWH Bible Platform
sonar.projectVersion=1.1

# Source layout — only the Python production tree, not data files.
# content/notes/*.py is data (long HTML body tuples per the
# pyproject.toml per-file-ignores), excluded.
sonar.sources=scripts
sonar.tests=tests

sonar.python.version=3.10,3.11,3.12,3.13,3.14

# What NOT to analyze. Mirrors .gitignore + pyproject.toml's
# ruff `extend-exclude` so static analysis matches code review.
sonar.exclusions=\
    **/__pycache__/**,\
    **/*.pyc,\
    **/.backups/**,\
    content/notes/**,\
    content/translations/**,\
    content/sources/**,\
    content/candidates/**,\
    epub_working/**,\
    exports/**,\
    builds/**,\
    kings_session/**,\
    source_archive/**,\
    assets/**,\
    _audit_state.json

sonar.test.exclusions=\
    tests/fixtures.py

# SCM — required for per-line blame on issues.
sonar.scm.provider=git

# Encoding — the project is UTF-8 throughout (memory: PYTHONUTF8=1).
sonar.sourceEncoding=UTF-8
