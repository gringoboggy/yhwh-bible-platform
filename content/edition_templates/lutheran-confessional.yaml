# ψ.7-B edition template — Lutheran Confessional (mirror of ψ.7-A built-in).
#
# Use case: confessional Lutheran users (LCMS, WELS, ELS, ILC)
# who want to start from a known-good Lutheran configuration
# and tweak for their personal build.

template_id: lutheran-confessional
template_label: "Lutheran Confessional (mirror of built-in)"
template_description: >
  Mirrors the eponymous ψ.7-A built-in edition for clone-and-tweak
  workflows. Protestant canon (66 books, with Apocrypha as a
  separate "useful but not normative" section per Luther's
  prefaces). Reformation-era commentary foregrounded; confessional
  theology emphasized.

canon: protestant
title: "The Lutheran Confessional Study Bible"
short_title: "Lutheran Confessional"
target_audience: "Confessional Lutheran readers (LCMS, WELS, ELS, ILC); seminary students"
enabled_categories:
  - lang
  - text
  - xref
  - hist
  - lit
  - comm
  - dev
  - apol
  - dist
enabled_kinds:
  - dist-typological
disabled_kinds:
  - comm-orthodox
  - comm-catholic
  - comm-ethiopian
  - comm-rabbinic
  - dist-mariological
  - dist-allegorical
  - dist-mystical
  - liturgy-ethiopian
  - liturgy-torah-portion
max_phase: phase2
cover_image: ""
notes: "Foregrounds comm-reformation, comm-patristic (Augustine + Cappadocian Fathers prized in Luther's tradition), dev-application, apol-harmonization, dist-typological."
popup_languages_default:
  - "english"
  - "hebrew"
  - "greek"
popup_translation: ""
