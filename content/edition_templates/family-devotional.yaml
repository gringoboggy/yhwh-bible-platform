# ψ.7-B edition template — Family devotional.
#
# Use case: lay families reading together. Q&A-style apparatus,
# mid-density, family-reading rhythm.

template_id: family-devotional
template_label: "Family devotional"
template_description: >
  Q&A-style apparatus, mid-density, family-reading rhythm.
  Each chapter has a short summary, 2-3 discussion questions,
  and a meditation prompt. Suitable for lay families wanting
  to read together regularly without seminary-level density.

