  - lang-greek
  - lang-aramaic
  - lang-syriac
  - lang-grammar
  - lang-translation
  - lang-latin
  - text-dss
  - text-conjecture
  - text-witness
  - comm-rabbinic
  - comm-modern-critical
  - dist-allegorical
  - dist-mariological
  - dist-mystical
  - apol-difficulty
max_phase: mvp
cover_image: ""
notes: "Foregrounds dev-application, dev-prayer, ped-summary, comm-patristic (light), comm-evangelical (where available). Mid-density: more than children's edition, less than scholarly."
popup_languages_default:
