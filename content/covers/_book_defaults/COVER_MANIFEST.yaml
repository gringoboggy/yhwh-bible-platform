# Per-book title-page cover art manifest — reimagined full-bleed scene plates (v4).
# REGEN: Each book is redrawn in a unified Grok painterly family. Midjourney plates
# in _scenes/_midjourney/ are REFERENCE ONLY (subject + scenery ideas) — never
# composited or shipped. Finished regen lands in _scenes/<variant>/<code>.jpg.
# Compose: crimson grade + soft edge fade (no leather, no gold border). A/B/C share
# the same plate treatment; variants differ by composition prompt only.
# Edition Bible covers still use content/covers/templates/ (leather + gold).

style:
  template: null
  border: none
  output: [1024, 1536]
  regen_wave: v4_reimagine
  compose:
    sharpen: 1.14
    vignette: 0.12
    style_grade: true
    scene_source: grok_first
  reimagine:
    reference_dir: "_midjourney"
    use_reference: inspiration_only
  prompt_prefix: >
    Completely reimagine this biblical book title plate from scratch in a unified
    cohesive family style. Use any reference only for subject and scenery ideas —
    redraw every element fresh. Vertical 2:3 full-bleed painterly environment
    filling the frame edge to edge:
  prompt_suffix: >
    Deep crimson and burgundy atmosphere, warm directional golden-hour light,
    refined illustrative brushwork with sharper detail. Painterly realism — more
    real than flat cartoon, not a photograph, not hyperreal CGI. No leather texture,
    no book binding, no gold frame, no decorative border. Soft natural edges that
    belong to the scene. No text, no letters, no watermark, no human faces in
    close-up. Ethiopian study-Bible plate family — every book matches this look.
  variants:
    default:
      scene_dir: ""
      out_dir: ""
      prompt_extra: ""
    alt02:
      scene_dir: "alt02"
      out_dir: "alt02"
      prompt_extra: >
        Alternate composition B — wider framing, motif smaller and centered,
        slightly different angle on the same symbolic subject.
    alt03:
      scene_dir: "alt03"
      out_dir: "alt03"
      prompt_extra: >
        Alternate composition C — closer cropped detail, motif more prominent,
        different lighting emphasis on the same symbolic subject.

