# canons.yaml — canon → books mapping for edition-level book filtering.
# ----------------------------------------------------------------------
# The build pipeline (build_edition.py) reads this to determine which
# books appear in each edition's EPUB. Books outside an edition's canon
# are spliced out of the master HTML, manifest, spine, and TOC.
#
# Conventions:
#   - Each canon lists the BOOK CODES (matching content/books.yaml)
#     that belong to it.
#   - A book may appear in multiple canons (most do).
#   - The Ethiopian canon is the broadest and acts as the master superset;
#     all other canons are subsets of it.
#
# Where the underlying WEB text uses Christian split numbering (e.g.
# 1 Sam + 2 Sam are two book files), both halves are listed even for
# canons that count them as one book (Tanakh counts Shmuel as one book
# but our HTML splits it; we keep both halves for that canon).
#
# Books deliberately NOT yet present in our corpus (and therefore
# absent from the canons that would otherwise include them):
#   - 1 Maccabees, 2 Maccabees    (Catholic + Orthodox + Ethiopian)
#   - 3 Maccabees                  (Orthodox + Ethiopian)
#   - 4 Maccabees                  (Orthodox appendix; some Ethiopian)
#   - Psalm 151                    (Orthodox + Ethiopian; some traditions
#                                    embed it inside Psalms file already)
# When these texts are added to the corpus, update both books.yaml AND
# the relevant canons here.

canons:

  # ──────────────────────────────────────────────────────────────────
  # TANAKH — Hebrew Bible (24 books in Jewish numbering; ~39 in
  # Christian split). No deuterocanonicals, no additions to Esther
  # or Daniel, no NT.
  # ──────────────────────────────────────────────────────────────────
  tanakh:
    label: "Hebrew Bible (Tanakh)"
    description: "24 books — Torah, Nevi'im, Ketuvim. No deuteros, no additions, no NT."
    books:
      # Torah
      - gen
      - exo
      - lev
      - num
      - deu
      # Nevi'im (Former Prophets)
      - jos
      - jdg
      - 1sa
      - 2sa
      - 1ki
      - 2ki
      # Nevi'im (Latter Prophets — major)
      - isa
      - jer
      - eze
      # Nevi'im (Latter Prophets — Twelve)
      - hos
      - joe
      - amo
      - oba
      - jon
      - mic
      - nah
      - hab
      - zep
      - hag
      - zec
      - mal
      # Ketuvim
      - psa
      - pro
      - job
      - sng
      - rut
      - lam
      - ecc
      - est
      - dan
      - ezr
      - neh
      - 1ch
      - 2ch

