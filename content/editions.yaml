    target_audience: "Builders rendering an Amharic-language standalone EOTC Bible with a faithful English back-translation as a reading aid; Amharic-speaking readers; diaspora Tewahedo communities"
    standalone: true
    base_translation: amharic-tewahedo
    enabled_categories:
      - lang
      - text
      - xref
      - hist
      - lit
      - comm
      - compare
      - liturgy
    enabled_kinds:
      - dist-typological
      - dist-mariological
    disabled_kinds:
