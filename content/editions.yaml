# editions.yaml — edition profiles for the multi-SKU build pipeline.
#
# Each edition specifies which kinds / categories of notes appear in its
# build. The build pipeline (build_epub.py --edition <id>) filters notes
# by these rules to produce a market-tuned EPUB from the single master
# corpus.
#
# Conflict-handling posture (project-wide): ACADEMIC.
#   We show all major traditions' views per edition, clearly labeled
#   by their `comm-*` sub-kind. Each edition's distinctive readings sit
#   alongside the others, not replacing them. The edition tunes which
#   FAMILIES are included, not which views within a family.
#
# Filter semantics:
#   - enabled_categories: list of category ids that are included by default
#   - enabled_kinds:      explicit kind codes to ADD even if their category
#                         is not in enabled_categories
#   - disabled_kinds:     explicit kind codes to REMOVE even if their
#                         category is enabled
#
# Phase tags are also respected: an edition can opt out of `phase3` kinds
# entirely with `max_phase: phase2`.

editions:

  # ──────────────────────────────────────────────────────────────────
  # First commercial SKU. Distinctive market — Tewahedo Orthodox
  # readers, Coptic / Eritrean parallels, scholarly Ethiopians abroad.
  # Includes the broader 87-book canon (already in this project).
  # ──────────────────────────────────────────────────────────────────
  - id: ethiopian-tewahedo
    canon: ethiopian
    title: "The Ethiopian Tewahedo Study Bible"
    short_title: "Ethiopian Tewahedo SB"
    isbn: "978-XXX-XXXXX-XX-X"
    target_audience: "Ethiopian Tewahedo, Coptic, Eritrean Orthodox; scholars of the Ethiopian canon"
    enabled_categories:
      - lang
      - text
      - xref
      - hist
      - lit
      - comm
      - compare
      - liturgy
    enabled_kinds:
      - dist-typological
      - dist-mariological
    disabled_kinds:
      - comm-reformation
      - comm-contextual
    max_phase: mvp
    cover_image: "covers/ethiopian-tewahedo.jpg"
    notes: "Leads with comm-ethiopian and liturgy-ethiopian; foregrounds compare-pseudepigrapha (1 Enoch and Jubilees are canonical here)."

  # ──────────────────────────────────────────────────────────────────
  # Largest English-speaking religious market. Magisterial-friendly,
  # includes deuterocanonical content, foregrounds Marian and patristic
  # readings.
  # ──────────────────────────────────────────────────────────────────
    popup_languages_default:
      - "english"
      - "hebrew"
      - "greek"

  - id: catholic-study
    canon: catholic
    popup_translation: ""
    title: The Catholic Study Bible — Ethiopian Edition
    short_title: Catholic SB Ethiopian
    isbn: 978-XXX-XXXXX-XX-Y
    target_audience: Roman Catholic readers interested in the broader canon
    enabled_categories:
      - lang
      - text
      - xref
      - hist
      - lit
      - comm
      - compare
      - liturgy
      - dist
    disabled_kinds:
      - comm-reformation
    max_phase: phase2
    cover_image: ""
    notes: Foregrounds comm-patristic, comm-catholic, dist-mariological, dist-typological, liturgy-christian-year.
    popup_languages_default:
      - english
      - hebrew
      - greek
    enabled_reading_plans:
  - id: evangelical-reformed
    canon: protestant
    title: "The Reformed Study Bible — Expanded Canon"
    short_title: "Reformed SB"
    isbn: "978-XXX-XXXXX-XX-Z"
    target_audience: "Evangelical / Reformed readers"
    enabled_categories:
      - lang
      - text
      - xref
      - hist
      - lit
      - comm
      - dev
      - apol
      - dist
    disabled_kinds:
      - comm-catholic
      - comm-orthodox
      - comm-ethiopian
      - dist-mariological
      - dist-mystical
      - dist-allegorical
    max_phase: phase2
    cover_image: "covers/evangelical-reformed.jpg"
    notes: "Foregrounds comm-reformation, comm-modern-critical, dist-typological, dev-application."

  # ──────────────────────────────────────────────────────────────────
  # Sophisticated, less competition. Foregrounds rabbinic, Hebrew,
  # parashot. Excludes NT and Christian-distinctive content.
  # ──────────────────────────────────────────────────────────────────
    popup_languages_default:
      - "english"
      - "greek"

  - id: jewish-study
    canon: tanakh
    title: "The Jewish Study Tanakh — Expanded"
    short_title: "Jewish Tanakh"
    isbn: "978-XXX-XXXXX-XX-W"
    target_audience: "Jewish readers, academic scholars of Hebrew Bible"
    enabled_categories:
      - lang
      - text
      - xref
      - hist
      - lit
      - comm
      - compare
      - liturgy
    disabled_kinds:
      - comm-patristic
      - comm-orthodox
      - comm-catholic
      - comm-reformation
      - comm-ethiopian
      - dist-typological
      - dist-mariological
      - liturgy-christian-year
      - liturgy-ethiopian
    max_phase: phase2
    cover_image: "covers/jewish-study.jpg"
    notes: "Foregrounds comm-rabbinic, lang-hebrew, liturgy-torah-portion. Does not include NT books in build manifest (handled at book level, not kind level)."

  # ──────────────────────────────────────────────────────────────────
  # Smallest market, highest prestige. Includes everything; no
  # tradition-leveling. The 'Oxford Annotated' position.
  # ──────────────────────────────────────────────────────────────────
    popup_languages_default:
      - "english"
      - "hebrew"

  - id: scholarly-academic
    canon: ethiopian
    title: "The Annotated Ethiopian Bible — Scholar's Edition"
    short_title: "Scholar's Edition"
    isbn: "978-XXX-XXXXX-XX-V"
    target_audience: "Academic scholars, libraries, seminaries"
    enabled_categories:
      - lang
      - text
      - xref
      - hist
      - lit
      - comm
      - compare
      - apol
      - modern
      - dist
    max_phase: phase3
    cover_image: "covers/scholarly-academic.jpg"
    notes: "Includes everything available. The current project state is closest to this edition."
    popup_languages_default:
      - "english"
      - "hebrew"
      - "greek"

  # ──────────────────────────────────────────────────────────────────
  # ψ.7-A — Eastern Orthodox edition. Uses the orthodox canon
  # (78 books, LXX-leaning OT) which was previously defined but
  # unused. Foregrounds Patristic + Byzantine commentary; rejects
  # Reformation-era posture; differs from Catholic Mariology.
  # ──────────────────────────────────────────────────────────────────
  - id: eastern-orthodox
    canon: orthodox
    title: "The Eastern Orthodox Study Bible"
    short_title: "Orthodox SB"
    isbn: "978-XXX-XXXXX-XX-O"
    target_audience: "Eastern Orthodox readers; LXX-leaning scholarship; Byzantine Rite parishes"
    enabled_categories:
      - lang
      - text
      - xref
      - hist
      - lit
      - comm
      - compare
      - liturgy
      - dist
    enabled_kinds:
      - dist-typological
      - dist-mystical
    disabled_kinds:
      - comm-reformation
      - comm-modern-critical
      - comm-ethiopian
      - dist-mariological
      - liturgy-ethiopian
    max_phase: phase2
    cover_image: "covers/eastern-orthodox.jpg"
    notes: "Foregrounds comm-orthodox, comm-patristic, dist-typological, dist-mystical, liturgy-christian-year. LXX-leaning OT (text-lxx prominent). Excludes comm-reformation (rejects sola-scriptura), dist-mariological (Orthodox Marian theology differs structurally from Catholic), comm-modern-critical (post-Enlightenment hermeneutic conflicts with Patristic synthesis)."
    popup_languages_default:
      - "english"
      - "greek"
    popup_translation: ""

  # ──────────────────────────────────────────────────────────────────
  # ψ.7-A — Anglican Book of Common Prayer edition. Uses catholic
  # canon (76 books — Apocrypha as deuterocanonical). BCP-style
  # apparatus; broad-church inclusive of evangelical + catholic
  # streams; explicitly non-Marian per 39 Articles.
  # ──────────────────────────────────────────────────────────────────
  - id: anglican-bcp
    canon: catholic
    title: "The Anglican Study Bible — BCP Edition"
    short_title: "Anglican BCP"
    isbn: "978-XXX-XXXXX-XX-A"
    target_audience: "Anglican / Episcopal readers; BCP-tradition parishes; broad-church audience"
    enabled_categories:
      - lang
      - text
      - xref
      - hist
      - lit
      - comm
      - compare
      - liturgy
      - dev
      - dist
    enabled_kinds:
      - dist-typological
    disabled_kinds:
      - comm-orthodox
      - comm-ethiopian
      - dist-mariological
      - dist-allegorical
      - liturgy-ethiopian
      - liturgy-torah-portion
    max_phase: phase2
    cover_image: "covers/anglican-bcp.jpg"
    notes: "Foregrounds comm-patristic, comm-modern-critical, comm-reformation, dev-prayer, liturgy-christian-year (tied to BCP lectionary). Apocrypha included as deuterocanonical (read but not doctrinally normative per Article VI). Excludes dist-mariological (Article XXII / 39 Articles posture) and dist-allegorical (Reformation-era Anglican preference for plain sense)."
    popup_languages_default:
      - "english"
      - "hebrew"
      - "greek"
      - "latin"
    popup_translation: ""

  # ──────────────────────────────────────────────────────────────────
  # ψ.7-A — Lutheran Confessional edition. Uses protestant canon
  # (66 books, with Apocrypha as a separate "useful but not normative"
  # section per Luther's prefaces). Reformation-era commentary
  # foregrounded; confessional theology emphasized.
  # ──────────────────────────────────────────────────────────────────
  - id: lutheran-confessional
    canon: protestant
    title: "The Lutheran Confessional Study Bible"
    short_title: "Lutheran Confessional"
    isbn: "978-XXX-XXXXX-XX-L"
    target_audience: "Confessional Lutheran readers (LCMS, WELS, ELS, ILC); seminary students"
    enabled_categories:
      - lang
      - text
      - xref
      - hist
      - lit
      - comm
      - dev
      - apol
      - dist
    enabled_kinds:
      - dist-typological
    disabled_kinds:
      - comm-orthodox
      - comm-catholic
      - comm-ethiopian
      - comm-rabbinic
      - dist-mariological
      - dist-allegorical
      - dist-mystical
      - liturgy-ethiopian
      - liturgy-torah-portion
    max_phase: phase2
    cover_image: "covers/lutheran-confessional.jpg"
    notes: "Foregrounds comm-reformation, comm-patristic (Augustine + Cappadocian Fathers prized in Luther's tradition), dev-application, apol-harmonization, dist-typological. Apocrypha included via canon=protestant (which doesn't contain it; Lutheran practice typically appends as separate 'useful' section — handled via per-book toggling at build time). Excludes Catholic / Orthodox / Rabbinic commentary kinds (different magisterial postures)."
    popup_languages_default:
      - "english"
      - "hebrew"
      - "greek"
    popup_translation: ""

  # ──────────────────────────────────────────────────────────────────
  # ψ.7-A — Coptic Orthodox edition. Uses ethiopian canon (87 books;
  # Coptic shares ~78 of these with Ethiopian Tewahedo). Coptic
  # patristic + ascetic-monastic emphasis; Alexandrian theological
  # heritage. Distinct from Greek Orthodox in liturgical detail
  # but shares broader Eastern hermeneutic.
  # ──────────────────────────────────────────────────────────────────
  - id: coptic-orthodox
    canon: ethiopian
    title: "The Coptic Orthodox Study Bible"
    short_title: "Coptic SB"
    isbn: "978-XXX-XXXXX-XX-C"
    target_audience: "Coptic Orthodox readers; Alexandrian theology; ascetic-monastic tradition; diaspora communities"
    enabled_categories:
      - lang
      - text
      - xref
      - hist
      - lit
      - comm
      - compare
      - liturgy
      - dist
    enabled_kinds:
      - dist-typological
      - dist-mystical
      - dist-allegorical
    disabled_kinds:
      - comm-reformation
      - comm-modern-critical
      - comm-rabbinic
      - dist-mariological
      - liturgy-torah-portion
    max_phase: phase2
    cover_image: "covers/coptic-orthodox.jpg"
    notes: "Foregrounds comm-orthodox, comm-patristic, comm-ethiopian (shared monastic + ascetic heritage), dist-allegorical (Alexandrian school exegesis), dist-typological, dist-mystical, liturgy-ethiopian (shared liturgical roots). Excludes comm-reformation, comm-modern-critical, dist-mariological (Coptic Mariology has its own structure, distinct from Catholic). Pairs naturally with the existing ethiopian-tewahedo edition for a 'broader Egyptian church' demo."
    popup_languages_default:
      - "english"
      - "greek"
      - "arabic"
    popup_translation: ""

