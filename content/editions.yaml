# editions.yaml — edition profiles for the multi-SKU build pipeline.
#
# Each edition specifies which kinds / categories of notes appear in its
# build. The build pipeline (build_epub.py --edition <id>) filters notes
# by these rules to produce a market-tuned EPUB from the single master
# corpus.
#
# Conflict-handling posture (project-wide): ACADEMIC.
#   We show all major traditions' views per edition, clearly labeled
#   by their `comm-*` sub-kind. Each edition's distinctive readings sit
#   alongside the others, not replacing them. The edition tunes which
#   FAMILIES are included, not which views within a family.
#
# Filter semantics:
#   - enabled_categories: list of category ids that are included by default
#   - enabled_kinds:      explicit kind codes to ADD even if their category
#                         is not in enabled_categories
#   - disabled_kinds:     explicit kind codes to REMOVE even if their
#                         category is enabled
#
# Phase tags are also respected: an edition can opt out of `phase3` kinds
# entirely with `max_phase: phase2`.

editions:

  # ──────────────────────────────────────────────────────────────────
  # First flagship edition — distinctive Tewahedo Orthodox canon
  # readers, Coptic / Eritrean parallels, scholarly Ethiopians abroad.
  # Includes the broader 87-book canon (already in this project).
  # ──────────────────────────────────────────────────────────────────
  - id: ethiopian-tewahedo
    # RX P4a — Kobo-safe in-content ToC: book-list-only (Kobo can't render <details>;
    # chapter nav lives in the reader's NATIVE ToC, enriched to chapter level at build)
    reader_toc_collapsible: false
    reader_toc_books_only: true
    # K-R9/K-R10/K-R11 — study badges navigate to backmatter glossary (not footnote popups).
    reader_eink_study_layout: backmatter
    # Note-presentation rehaul (build-time, lossless, option-gated) — enabled for the
    # flagship Ethiopian Tewahedo Study Bible. S1 (note_attribution_dedup) drops each
    # leaf's redundant kind-label / self-attributing comm-ethiopian byline; S2
    # (note_group_by_category) groups the apparatus into a verse → category → source →
    # note cascade (15 per-category group spines); S3a (note_topic_dedup) unions the
    # Nave's + Torrey topical terms (vocab-aware longest-match) into one deduped Topics
    # row. Lossless + leaf-count-guarded; the flag-off path stays byte-identical.
    # See docs/superpowers/specs/2026-06-08-note-presentation-rehaul-design.md.
    note_attribution_dedup: true
    note_group_by_category: true
    note_topic_dedup: true
    canon: ethiopian
    title: "The Ethiopian Tewahedo Study Bible"
    display_name: "Ethiopian Tewahedo Bible"
    short_title: "Ethiopian Tewahedo SB"
    # K-R2-8 — feeds the OPF <dc:description> (the e-reader library synopsis) via
    # patch_opf; 83 = the shipped numbered-book superset (NEVER 87/88).
    description: "The complete Ethiopian Bible in English: 83 scriptures including the Missing Apocrypha, the Book of Enoch, and the Book of Jubilees. Compiled from public-domain translations."
    target_audience: "Ethiopian Tewahedo, Coptic, Eritrean Orthodox; scholars of the Ethiopian canon"
    enabled_categories:
      # beta-3 (h) — FULL build: every note category that has content is enabled so
      # the shipped Ethiopian Tewahedo Study Bible carries the complete ~90k+ note
      # apparatus and all original-language popups (the user's "all notes, all
      # translations" final build). dev/ped/vis are currently empty but listed so
      # any future notes in them ship automatically.
      - lang
      - text
      - xref
      - hist
      - lit
      - comm
      - compare
      - apol
      - modern
      - dist
      - topic
      - liturgy
      - dev
      - ped
      - vis
    disabled_kinds:
      # AI-drafted commentary stays OFF — opt-in only (the website promises this).
      - comm-ai
    max_phase: phase3
