  # ──────────────────────────────────────────────────────────────────
  # ψ.7-A — Eastern Orthodox edition. Uses the orthodox canon
  # (78 books, LXX-leaning OT) which was previously defined but
  # unused. Foregrounds Patristic + Byzantine commentary; rejects
  # Reformation-era posture; differs from Catholic Mariology.
  # ──────────────────────────────────────────────────────────────────
  - id: eastern-orthodox
    canon: orthodox
    title: "The Eastern Orthodox Study Bible"
    short_title: "Orthodox SB"
    isbn: "978-XXX-XXXXX-XX-O"
    target_audience: "Eastern Orthodox readers; LXX-leaning scholarship; Byzantine Rite parishes"
    enabled_categories:
      - lang
      - text
      - xref
      - hist
      - lit
      - comm
      - compare
      - liturgy
      - dist
    enabled_kinds:
      - dist-typological
      - dist-mystical
    disabled_kinds:
      - comm-reformation
      - comm-modern-critical
      - comm-ethiopian
      - dist-mariological
      - liturgy-ethiopian
    max_phase: phase2
    cover_image: "covers/eastern-orthodox.jpg"
    notes: "Foregrounds comm-orthodox, comm-patristic, dist-typological, dist-mystical, liturgy-christian-year. LXX-leaning OT (text-lxx prominent). Excludes comm-reformation (rejects sola-scriptura), dist-mariological (Orthodox Marian theology differs structurally from Catholic), comm-modern-critical (post-Enlightenment hermeneutic conflicts with Patristic synthesis)."
    popup_languages_default:
      - "english"
      - "greek"
    popup_translation: ""

  # ──────────────────────────────────────────────────────────────────
  # ψ.7-A — Anglican Book of Common Prayer edition. Uses catholic
  # canon (76 books — Apocrypha as deuterocanonical). BCP-style
  # apparatus; broad-church inclusive of evangelical + catholic
  # streams; explicitly non-Marian per 39 Articles.
  # ──────────────────────────────────────────────────────────────────
  - id: anglican-bcp
    canon: catholic
    title: "The Anglican Study Bible — BCP Edition"
    short_title: "Anglican BCP"
    isbn: "978-XXX-XXXXX-XX-A"
    target_audience: "Anglican / Episcopal readers; BCP-tradition parishes; broad-church audience"
    enabled_categories:
      - lang
      - text
      - xref
      - hist
      - lit
      - comm
      - compare
      - liturgy
      - dev
      - dist
    enabled_kinds:
      - dist-typological
    disabled_kinds:
      - comm-orthodox
      - comm-ethiopian
      - dist-mariological
      - dist-allegorical
      - liturgy-ethiopian
      - liturgy-torah-portion
    max_phase: phase2
    cover_image: "covers/anglican-bcp.jpg"
    notes: "Foregrounds comm-patristic, comm-modern-critical, comm-reformation, dev-prayer, liturgy-christian-year (tied to BCP lectionary). Apocrypha included as deuterocanonical (read but not doctrinally normative per Article VI). Excludes dist-mariological (Article XXII / 39 Articles posture) and dist-allegorical (Reformation-era Anglican preference for plain sense)."
    popup_languages_default:
      - "english"
      - "hebrew"
      - "greek"
      - "latin"
    popup_translation: ""

  # ──────────────────────────────────────────────────────────────────
  # ψ.7-A — Lutheran Confessional edition. Uses protestant canon
  # (66 books, with Apocrypha as a separate "useful but not normative"
  # section per Luther's prefaces). Reformation-era commentary
  # foregrounded; confessional theology emphasized.
  # ──────────────────────────────────────────────────────────────────
  - id: lutheran-confessional
    canon: protestant
    title: "The Lutheran Confessional Study Bible"
    short_title: "Lutheran Confessional"
    isbn: "978-XXX-XXXXX-XX-L"
    target_audience: "Confessional Lutheran readers (LCMS, WELS, ELS, ILC); seminary students"
    enabled_categories:
      - lang
      - text
      - xref
      - hist
      - lit
      - comm
      - dev
      - apol
      - dist
    enabled_kinds:
      - dist-typological
    disabled_kinds:
      - comm-orthodox
      - comm-catholic
      - comm-ethiopian
      - comm-rabbinic
      - dist-mariological
      - dist-allegorical
      - dist-mystical
      - liturgy-ethiopian
      - liturgy-torah-portion
    max_phase: phase2
    cover_image: "covers/lutheran-confessional.jpg"
    notes: "Foregrounds comm-reformation, comm-patristic (Augustine + Cappadocian Fathers prized in Luther's tradition), dev-application, apol-harmonization, dist-typological. Apocrypha included via canon=protestant (which doesn't contain it; Lutheran practice typically appends as separate 'useful' section — handled via per-book toggling at build time). Excludes Catholic / Orthodox / Rabbinic commentary kinds (different magisterial postures)."
    popup_languages_default:
      - "english"
      - "hebrew"
      - "greek"
    popup_translation: ""

  # ──────────────────────────────────────────────────────────────────
  # ψ.7-A — Coptic Orthodox edition. Uses ethiopian canon (87 books;
  # Coptic shares ~78 of these with Ethiopian Tewahedo). Coptic
  # patristic + ascetic-monastic emphasis; Alexandrian theological
  # heritage. Distinct from Greek Orthodox in liturgical detail
  # but shares broader Eastern hermeneutic.
  # ──────────────────────────────────────────────────────────────────
  - id: coptic-orthodox
    canon: ethiopian
    title: "The Coptic Orthodox Study Bible"
    short_title: "Coptic SB"
    isbn: "978-XXX-XXXXX-XX-C"
    target_audience: "Coptic Orthodox readers; Alexandrian theology; ascetic-monastic tradition; diaspora communities"
    enabled_categories:
      - lang
      - text
      - xref
      - hist
      - lit
      - comm
      - compare
      - liturgy
      - dist
    enabled_kinds:
      - dist-typological
      - dist-mystical
      - dist-allegorical
    disabled_kinds:
      - comm-reformation
      - comm-modern-critical
      - comm-rabbinic
      - dist-mariological
      - liturgy-torah-portion
    max_phase: phase2
    cover_image: "covers/coptic-orthodox.jpg"
    notes: "Foregrounds comm-orthodox, comm-patristic, comm-ethiopian (shared monastic + ascetic heritage), dist-allegorical (Alexandrian school exegesis), dist-typological, dist-mystical, liturgy-ethiopian (shared liturgical roots). Excludes comm-reformation, comm-modern-critical, dist-mariological (Coptic Mariology has its own structure, distinct from Catholic). Pairs naturally with the existing ethiopian-tewahedo edition for a 'broader Egyptian church' demo."
    popup_languages_default:
      - "english"
      - "greek"
      - "arabic"
    popup_translation: ""

