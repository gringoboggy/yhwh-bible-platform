    notes: "Standalone Amharic Bible (full 87-book Tewahedo canon). Body text from content/translations/amharic-tewahedo/ (as-written-from-PDF per SCOPE_2026-05-16 §3); verse popups carry the faithful English back-translation from content/translations/amharic-tewahedo-en/ (Track F, gen shipped τ.F.gen1.a). NOT a popup-language slot in any other edition (per CLAUDE_PROJECT_RULES §1) — this is scripture in its own right. The build-pipeline wiring (read base_translation as body + popup_translation as popups) is deferred to τ.G.x.*; this ship only constitutes the edition record."
    popup_languages_default: []
    popup_translation: amharic-tewahedo-en

