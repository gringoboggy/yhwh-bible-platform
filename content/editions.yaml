  # ──────────────────────────────────────────────────────────────────
  # τ.G.constitution.a — Standalone Ge'ez Bible (2026-05-20).
  #
  # The first of the TWO standalone Bibles per CLAUDE_PROJECT_RULES §1
  # "Parallel-Bible end-state — two standalone Bibles" (codified
  # 2026-05-16). This is NOT a tradition/notes-filter variant of the
  # four catalog study editions — it is a full-text scripture edition in its own
  # right whose base text is the Ge'ez Tewahedo Bible
  # (content/translations/geez-tewahedo/) and whose verse popups carry
  # a FAITHFUL ENGLISH BACK-TRANSLATION of that Ge'ez wording (from
  # content/translations/geez-tewahedo-en/ — Track F).
  #
  # Verse-popup policy (project rules §1):
  #   - popup_languages_default: []  -- NO inter-language popups; the
  #     EN back-translation goes via popup_translation below, not via
  #     popup_languages_default (which is for parallel-language popups
  #     on OTHER editions).
  #   - popup_translation: geez-tewahedo-en  -- the EN back-translation
  #     slot. Build pipeline (τ.G.x.*, deferred) reads this as the popup
  #     content source.
  #   - base_translation: geez-tewahedo  -- the actual Ge'ez body text
  #     of THIS Bible. The standalone-Bible build flow (deferred) uses
  #     this instead of the English editorial baseline.
  #   - standalone: true  -- marks this edition as a standalone Bible
  #     distinct from the multi-tradition notes editions; lets the
  #     build pipeline + consoles + matrix branch on standalone flow.
  #
  # cover: σ.5 (2026-06-04) gave the 2 standalone Bibles default composed
  # covers with Ethiopic-script main titles (cover_template + cover_main_title
  # below; rendered via generate_edition_covers' Ethiopic-aware font picker).
  # Builder-overridable like every edition's cover.
  # ──────────────────────────────────────────────────────────────────
  - id: standalone-geez
    # RX P4a — Kobo-safe in-content ToC: book-list-only (Kobo can't render <details>;
    # chapter nav lives in the reader's NATIVE ToC, enriched to chapter level at build)
    reader_toc_collapsible: false
    reader_toc_books_only: true
    language_code: gez
    canon: ethiopian
    title: "The Ge'ez Bible — Standalone Tewahedo Edition"
    display_name: "Ge'ez Tewahedo Bible"
    short_title: "Ge'ez Bible"
    target_audience: "Builders rendering a Ge'ez-language standalone EOTC Bible with a faithful English back-translation as a reading aid; Tewahedo scholars; Ge'ez learners"
    standalone: true
    base_translation: geez-tewahedo
    enabled_categories:
      - lang
      - text
      - xref
      - hist
      - lit
      - comm
      - compare
      - liturgy
    enabled_kinds:
      - dist-typological
      - dist-mariological
    disabled_kinds:
      - comm-reformation
      - comm-contextual
    max_phase: mvp
    # σ.5 — default cover. cover_main_title is the Ge'ez "Holy Bible" (with the
    # traditional ፡ word-divider); rendered through generate_edition_covers'
    # Ethiopic-aware font picker (σ.5.1). Builder-overridable like every edition.
    cover_template: "05_missal_central_red"
    cover_main_title: "መጽሐፍ ፡ ቅዱስ"
    cover_image: "covers/standalone-geez.jpg"
    notes: "Standalone Ge'ez Bible (full 87-book Tewahedo canon). Body text from content/translations/geez-tewahedo/; verse popups carry the faithful English back-translation from content/translations/geez-tewahedo-en/ (Track F, gen shipped τ.F.gen1.a). NOT a popup-language slot in any other edition (per CLAUDE_PROJECT_RULES §1) — this is scripture in its own right. The build-pipeline wiring (read base_translation as body + popup_translation as popups) is deferred to τ.G.x.*; this ship only constitutes the edition record."
    popup_languages_default: []
    popup_translation: geez-tewahedo-en

  # ──────────────────────────────────────────────────────────────────
  # τ.G.constitution.a — Standalone Amharic Bible (2026-05-20).
  #
  # The second of the TWO standalone Bibles. Same structural pattern as
