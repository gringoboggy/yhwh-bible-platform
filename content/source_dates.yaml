# source_dates.yaml — circa-year for each public-domain source family
# in the corpus. Used by Phase ψ.37 (time-traveling commentary) to
# filter notes by historical availability — "show me only what a
# reader in 1611 / 1879 / 1955 would have had."
#
# Match contract: a note's `attribution` field is checked (case-
# sensitive) for the LONGEST matching `prefix` in this list. The
# matched entry's `year` is the note's effective historical year.
# Notes with no match (e.g. "User original", "User paraphrase")
# return ``None`` from ``source_dates.lookup_year`` — they're
# treated as **contemporary** content (no fixed historical year).
#
# Filter semantics in build_edition: a note ships ONLY IF
#   - the edition's `time_filter_ceiling` is None (no filter), OR
#   - the note's effective year is not None AND <= ceiling.
# I.e. contemporary content (no year) is filtered OUT when a
# ceiling is set; this is the load-bearing design choice for
# "what a 1611 reader would have had" — User-original commentary
# was not part of the world in 1611.
#
# Ordering: longest prefix first (the lookup respects this so
# "Treasury of Scripture Knowledge (1830s)" beats "Treasury of
# Scripture Knowledge" when both would match).
sources:
  # Pre-1800 — primarily the foundational reference apparatus.
  - prefix: "Treasury of Scripture Knowledge (1830s)"
    year: 1834
    label: "TSK"
    note: "Treasury of Scripture Knowledge, R. A. Torrey ed."
  - prefix: "Treasury of Scripture Knowledge"
    year: 1834
    label: "TSK"
    note: "TSK (umbrella prefix)"

  # 1800s — concordances and topical indexes.
  - prefix: "Strong's "
    year: 1890
    label: "Strong's Concordance"
    note: "Both H and G entries (Hebrew + Greek); James Strong"
  - prefix: "Nave's Topical Bible"
    year: 1897
    label: "Nave's Topical"
    note: "Orville J. Nave, first published 1897"
  - prefix: "Easton's Illustrated Bible Dictionary"
    year: 1897
    label: "Easton's Bible Dictionary"
    note: "M. G. Easton, Illustrated Bible Dictionary (3rd ed. 1897); ingested 2026-05-21."
  - prefix: "Torrey's New Topical Textbook"
    year: 1897
    label: "Torrey's New Topical"
    note: "R.A. Torrey, New Topical Textbook (1897 PD); Track C ingest 2026-05-26 (+21,762 topic-torrey notes)."

  # 1900s — early-modern textual criticism.
  - prefix: "Frederic G. Kenyon"
    year: 1903
    label: "Kenyon, Our Bible and the Ancient Manuscripts"
  - prefix: "Frederic G"
    year: 1903
    label: "Kenyon (prefix variant)"
    note: "Catches truncated 'Frederic G' attributions"

  # Patristic and pseudepigraphical (γ.4 cluster — Tewahedo
  # commentary corpus). Year reflects the underlying source's
  # historical composition / availability — what a contemporary
  # reader at the cited year would have had. PD English editions
  # all post-1840 (Cramer Catenae) / 1859 (Payne Smith) / 1874
  # (NPNF) / 1898 (Gwynn-NPNF Ephrem) / 1902 (Charles Jubilees) /
  # 1912 (Charles 1 Enoch); the underlying SOURCE FAMILIES are
  # patristic (Cyril d. 444, Ephrem d. 373) and pseudepigraphical
  # (1 Enoch c. -300 to 100, Jubilees c. -150).
  - prefix: "Cyril of Alexandria"
    year: 430
    label: "Cyril of Alexandria"
    note: "Patriarch of Alexandria (d. 444); commentaries on John/Luke/Matthew. γ.4.1/.3/.6."
  - prefix: "Ephrem the Syrian"
    year: 370
    label: "Ephrem the Syrian"
    note: "Syrian Father (d. 373); commentaries on Pentateuch. γ.4.2."
  - prefix: "R.H. Charles, The Book of Enoch"
    year: -100
    label: "1 Enoch (R.H. Charles trans.)"
    note: "1 Enoch composition c. 300 BC - 100 AD; R.H. Charles trans. 1912 PD. γ.4.4."
  - prefix: "R.H. Charles, The Book of Jubilees"
    year: -150
    label: "Jubilees (R.H. Charles trans.)"
    note: "Jubilees composition c. 150 BC; R.H. Charles trans. 1902 PD. γ.4.5."
