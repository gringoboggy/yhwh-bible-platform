# Translation metadata — γ.5 LXX Greek seed (2026-05-11).
#
# Brenton's edition of the Septuagint (1844, Samuel Bagster & Sons,
# London) printed the Greek text of the Vatican Codex (B/03)
# alongside an English translation. Both halves are unambiguously
# public domain — Brenton died 1862; his edition predates the
# 1929 cutoff in every jurisdiction.
#
# γ.5 ships the Greek text only, with a 3-verse Genesis seed
# (Gen 1:1-3) to demonstrate the wire-up. γ.5.x will ingest the
# full corpus from a verified PD source dump.

id: lxx-brenton-greek
title: "Septuagint (Brenton, Greek text)"
short_title: "LXX"
license: "Public Domain"
source:
  publisher: "Samuel Bagster & Sons (London)"
  url: "https://archive.org/details/SeptuagintInterlinearGreekEnglish"
  package: "Brenton 1844 edition — Greek text of Codex Vaticanus tradition"
  fetched: 2026-05-11
  source_date: 1844
stats:
  books: 1            # seed only — Genesis
  verses: 3           # Gen 1:1-3 — the canonical opening seed
  books_outside_kjv: 0
notes: |
  γ.5 SEED CORPUS.

  This is a 3-verse seed (Genesis 1:1-3) that proves the
  translation-registry wire-up — the full LXX (~30 books,
  ~25,000 verses) ingestion is γ.5.x's deliverable.

  Once the directory is present, `list_translations()` discovers
  `lxx-brenton-greek` automatically; the /customize console
  surfaces it as a selectable popup_translation; the /compare
  console will render it side-by-side with other translations.
  But practical usage requires the rest of the corpus — γ.5.x.

  The Greek text reproduces the Codex Vaticanus tradition as
  printed in Brenton 1844. Standard editorial capitalization
  (initial capital on `Θεός` etc.) is retained; the original
  4th-century uncial manuscripts had no case distinction.

  Future γ.5.y can add Brenton's English-side translation as
  a separate `lxx-brenton-english` entry — both halves are PD
  and naturally pair (Brenton printed them in parallel columns).
