# Translation metadata — τ.6 Ge'ez Tewahedo seed (2026-05-12).
#
# Ge'ez (ግዕዝ) is the Classical Ethiopian liturgical language —
# the scriptural and liturgical tongue of the Ethiopian Orthodox
# Tewahedo Church (and Eritrean Orthodox Tewahedo, both
# non-Chalcedonian / Oriental Orthodox). The Tewahedo Bible has
# been preserved in Ge'ez manuscript form since the 4th-6th
# centuries CE.
#
# Significance for this project:
#
# - The ethiopian-tewahedo edition is the project's flagship; its
#   declared canon (87 books including 1 Enoch, Jubilees,
#   Meqabyan 1-3, etc.) IS the Ge'ez canon. Shipping Ge'ez source
#   text reinforces the v1.x uniqueness angle the project chose.
# - 1 Enoch and Jubilees survived as complete texts ONLY in the
#   Ge'ez tradition. Western scholarship had to recover them
#   from Ethiopian manuscripts in the 18th-19th centuries (R.H.
#   Charles' 1912 1 Enoch translation, which γ.4 references,
#   worked from Ge'ez manuscripts).
# - The Ge'ez biblical text sometimes preserves Septuagint
#   readings older than any surviving Greek manuscript — a fact
#   that drove much of 20th-century LXX textual criticism.
#
# PD basis: pre-1929 printed Ge'ez Bibles establish the textual
# tradition:
#
# - **Pell-Platt 1830 Ge'ez NT** (British and Foreign Bible
#   Society, London) — first widely-printed Ge'ez NT.
# - **BFBS 1853 Ge'ez Old Testament** — printed by the same
#   society, completing the Bible.
# - **Dillmann's Lexicon Linguae Aethiopicae (1865)** — the
#   definitive Ge'ez lexicon, citing canonical passages
#   verbatim.
#
# All three are unambiguously PD by age. The underlying
# manuscript tradition (Tana 9, EMML manuscripts, the various
# monastic codices) ranges from the 4th-15th century CE; all
# PD by age.
#
# τ.6 ships seed + metadata; τ.6.x is user-side full ingest from
# eBible.org's gez-Geez_vpl.zip package or a curated
# transcription of Pell-Platt 1830 + BFBS 1853.

