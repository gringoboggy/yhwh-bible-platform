notes: |
  τ.6 SEED CORPUS — UPGRADED 2026-05-15 via τ.6.x.2.a-h batch ship.

  This metadata file previously documented the Π.0 seed corpus
  (Genesis 1:1-3, 3 verses, 1 book). At τ.6.x.2.a-h (2026-05-15)
  the Geʽez column was upgraded to ocr-tier3 full-book ingests
  matching the Amharic τ.7.x.a-h ships for the entire parallel-
  Bible-EOTC scan range (pages 0-437; Pentateuch + Joshua + Judges
  + Ruth = 8 books). Stats updated: 1 book → 8 books, 3 verses →
  4337 verses, ~60.1% combined coverage at ocr-tier3 quality.

  Per D4-c sequencing inversion at τ.6.x.2.D: Amharic was shipped
  FIRST (τ.7.x.a-h) then Geʽez catchup (τ.6.x.2.a-h). Both columns
  now at parity for the parallel-Bible-EOTC scan boundary.

  ORIGINAL τ.6 SEED COMMENTARY (preserved below for historical
  context — describes the pre-τ.6.x.2 state):

  This is a 3-verse seed (Genesis 1:1-3) that proves the
  translation-registry wire-up. Once the directory is present,
  `list_translations()` discovers `geez-tewahedo` automatically;
  the /customize console surfaces it as a selectable
  popup_translation; the /compare console renders it side-by-
  side with all other registered translations.

  Significance for the flagship:

  The ethiopian-tewahedo edition does NOT currently declare
  `geez` in its popup_languages_default (it declares english /
  hebrew / greek). Adding `geez` to that list is an editorial
  decision the publisher makes; τ.6's seed makes it possible
  but doesn't force it. When the publisher chooses to surface
  Ge'ez in the popup, the runtime composes against this
  translation automatically.

  Unicode handling:

  - **Ethiopic** U+1200-U+137F: main syllabary (fidäl); covers
    standard text.
  - **Ethiopic Supplement** U+1380-U+139F: additional syllables
    + tonal marks.
  - **Ethiopic Extended** U+2D80-U+2DDF: more syllables (rare).
  - **Ethiopic Extended-A** U+AB00-U+AB2F: still more variants.

  The script is read left-to-right (unlike Hebrew + Arabic).
  Tewahedo numerals (፩ ፪ ፫ ...) live at U+1369-U+137C; standard
  Hindu-Arabic numerals are also acceptable for verse numbering.

  Pairs naturally with:
  - `wlc` Hebrew (the Ge'ez OT often preserves earlier readings
    than the MT).
  - `lxx-brenton-greek` (the Ge'ez OT was likely translated from
    a Greek LXX Vorlage in the 4th-5th century).
  - The 1 Enoch / Jubilees / Meqabyan books in the
    ethiopian-tewahedo canon — no other tradition has these as
    canonical scripture.

  Future τ.6.x can ingest the full Tewahedo 87-book canon (the
  6 books beyond the 81 of KJV+Apocrypha are: 1 Enoch, Jubilees,
  Meqabyan 1-3, Letter to the Laodiceans).
