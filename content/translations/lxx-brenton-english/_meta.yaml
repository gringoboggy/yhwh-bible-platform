# Translation metadata — τ.4 LXX Brenton English seed (2026-05-12).
#
# Brenton's edition of the Septuagint (1844, Samuel Bagster & Sons,
# London) printed the Greek text of the Vatican Codex (B/03)
# alongside an English translation in parallel columns. The Greek
# side ships as `lxx-brenton-greek` (γ.5, 2026-05-11); this is the
# English-side companion called for by SESSION_END_2026-05-12 §4
# N+2.
#
# Both halves are unambiguously Public Domain — Brenton died 1862;
# his 1844 edition predates the 1929 cutoff in every jurisdiction.
#
# τ.4 ships seed + metadata; τ.4.x is user-side full ingest from
# eBible.org's eng-Brenton_vpl.zip package.

