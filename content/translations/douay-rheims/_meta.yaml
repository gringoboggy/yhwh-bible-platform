# Translation metadata — τ.2 Douay-Rheims-Challoner English seed (2026-05-12).
#
# The Douay-Rheims Bible was the first complete English Catholic
# translation, made from the Latin Vulgate at the English College
# at Douai (NT 1582) and Rheims (OT 1610). Bishop Richard
# Challoner revised it in three rounds (1749 NT, 1750 OT, 1752
# NT). The 1899 John Murphy Company (Baltimore) edition is the
# canonical Challoner-text reprint and is Public Domain by age.
#
# Closes the Catholic English-translation column. Pairs with
# `vulgate-clementine` (τ.3) — DRA is the English translation OF
# that Vulgate. Together they form the Catholic-tradition
# translation pair, parallel to KJV+WLC (Reformation Protestant)
# and JPS+WLC (Jewish).
#
# τ.2 ships Gen 1:1-3 seed; τ.2.x is user-side full ingest from
# eBible.org's eng-DRA_vpl.zip package.

