notes: |
  τ.2 SEED CORPUS.

  This is a 3-verse seed (Genesis 1:1-3) that proves the
  translation-registry wire-up. Once the directory is present,
  `list_translations()` discovers `douay-rheims` automatically;
  the /customize console surfaces it as a selectable
  popup_translation; the /compare console renders it side-by-
  side with KJV, JPS, Vulgate Latin, etc.

  The full Catholic-canon ingest is τ.2.x's user-side
  deliverable.

  Stylistic notes:

  - Douay-Rheims is famously archaic. Genesis 1:3 reads
    "Be light made. And light was made." — a direct
    calque on the Vulgate's "Fiat lux. Et facta est lux."
    rather than the more natural "Let there be light." of
    KJV.
  - Verse 2 uses "spirit of God" in lowercase (matching the
    Vulgate's *spiritus Dei*); compare KJV's capitalized
    "Spirit of God" (Reformation theological emphasis).
  - "Heaven" is singular (matching the Latin *caelum* — singular
    in the Clementine), distinct from later English versions
    that sometimes render "the heavens."

  These archaisms are features not bugs for the catholic-study
  + anglican-bcp + scholarly-academic editions — the historical
  texture matters more than modern readability there. For
  modern-Catholic readers, NABRE / RSV-CE / NRSV-CE are
  alternatives but all are NOT public domain.

  Pairs with `vulgate-clementine` (τ.3) for side-by-side
  Latin / English display in /compare once both are fully
  ingested.
