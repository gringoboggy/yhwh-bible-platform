notes: |
  Douay-Rheims-Challoner — English Catholic translation of the Latin Vulgate. The original Douay-Rheims OT (1610) + NT (1582) was revised by Bishop Richard Challoner in three rounds (1749 NT, 1750 OT, 1752 NT). The 1899 John Murphy edition is the canonical Challoner-text reprint, Public Domain by age. Pairs with `vulgate-clementine` (Latin) as the Catholic-tradition translation pair (the way KJV + WLC pair for Reformation Protestants, and JPS + WLC pair for Jewish-tradition readers). Strengthens the catholic-study + anglican-bcp editions in particular. Famously archaic phrasings like 'Be light made. And light was made.' for Genesis 1:3 — a direct calque of the Vulgate's 'Fiat lux. Et facta est lux.' τ.2 ships Gen 1:1-3 seed; τ.2.x is user-side full ingest. Both Testaments — full Catholic canon.
