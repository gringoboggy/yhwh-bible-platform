# Translation metadata — τ.5-A WLC Hebrew seed (2026-05-12).
#
# The Westminster Leningrad Codex (WLC) is the de-facto-standard
# consonantal Hebrew text of the Tanakh used in modern critical
# Bible scholarship. It is a transcription by Christopher V.
# Kimball of the Leningrad Codex (Saint Petersburg, manuscript B19A,
# completed 1008 CE) — the oldest complete Masoretic Text manuscript
# in existence.
#
# The Kimball transcription is explicitly placed in the public
# domain by the transcriber (see tanach.us licensing). The
# underlying Leningrad Codex is itself out of copyright by virtue of
# age (>1000 years).
#
# τ.5-A ships seed + metadata; τ.5-A.x is user-side full ingest from
# tanach.us's Tanach.xml or the eBible.org `heb-wlc` package.
#
# Paired with `jps` (JPS 1917 English) under τ.5-A. JPS provides
# the English-language channel; WLC provides the Hebrew-text
# channel. Together they close the Hebrew column for the 6 of 9
# project editions that declare `hebrew` in popup_languages_default.

id: wlc
title: "Westminster Leningrad Codex (Hebrew)"
short_title: "WLC"
license: "Public Domain"
source:
  publisher: "Westminster Theological Seminary / tanach.us (Kimball transcription)"
  url: "https://tanach.us/Tanach.xml"
  package: "WLC consonantal Hebrew text (Leningrad Codex B19A, 1008 CE)"
  fetched: 2026-05-12
  source_date: 1008  # original manuscript date; Kimball transcription ongoing
stats:
  books: 1            # seed only — Genesis
  verses: 3           # Gen 1:1-3 — canonical opening seed
  books_outside_kjv: 0
notes: |
  τ.5-A SEED CORPUS.

  This is a 3-verse seed (Genesis 1:1-3) that proves the
  translation-registry wire-up. Once the directory is present,
  `list_translations()` discovers `wlc` automatically; the
  /customize console surfaces it as a selectable
  popup_translation.

  The seed includes the consonantal Hebrew text with vowel
  points (niqqud) and cantillation marks (te`amim). This is the
  standard form the WLC distributes — readers who want pure
  consonantal text (no points) can strip them programmatically
  via Unicode normalization (U+0591-U+05C7 range covers all
  Hebrew points and marks).

  Future τ.5-B can ship a WLC-without-points variant for
  scholars who want the unpointed consonantal text only.

  Full 39-book / ~23,000-verse Tanakh ingest is τ.5-A.x's
  user-side deliverable. The eBible.org package `heb-wlc_vpl.zip`
  is one canonical source; tanach.us's Tanach.xml is the other.
  Once downloaded into `content/translations/sources/wlc/` and
  processed, the user runs `python scripts/extract_translation.py
  wlc` to generate the per-book Python files.

  RTL rendering note: the runtime popup/compare consoles render
  Hebrew right-to-left. The reader EPUB output respects the
  edition's `dir="rtl"` settings per ν.2.7's popup-languages
  machinery.
