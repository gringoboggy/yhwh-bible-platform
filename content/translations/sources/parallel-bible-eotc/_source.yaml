# Source provenance — Parallel Geʽez–Amharic EOTC Bible
#
# This file documents the source PDF used by τ.6.x and τ.7.x for
# the parallel-Bible expansion. The PDF itself is NOT committed to
# the repository because (1) it is 202 MB which exceeds the
# project's binary-commit threshold without publisher authorization,
# and (2) it is publisher-supplied material that already lives in
# the user's local working directory.
#
# When the parallel-PDF extraction tool (scripts/extract_parallel_pdf.py)
# runs, it resolves the PDF path through the search order documented
# below. If the file cannot be found, the tool exits with a clear
# error message pointing here.

source_id: parallel-bible-eotc
description: |
  The parallel Geʽez–Amharic edition of the Ethiopian Orthodox
  Tewahedo Church (EOTC) Bible. 2,539 pages. Layout: Geʽez in the
  left column, Amharic in the right column, verse-aligned, with
  shared chapter headers (ምዕራፍ + Geʽez numeral). The same source
  the project_maccabees_expansion/ handoff package uses for the
  Phase-4 Geʽez-revision of Meqabyan; PROMOTED to the project's
  PRIMARY Geʽez + Amharic source at τ.6.x.0 (2026-05-14) after
  eBible.org's gez-Geez slot was verified removed.

primary_filename: Bible_Amharic_and_Geez.pdf
total_pages: 2539

# PDF size (bytes); checksum for integrity-verification.
expected_size_bytes: 202694977
expected_sha256: null  # populated at τ.6.x ship time

# Path resolution — the extractor tries these in order until one
# exists. Operator can override via PARALLEL_BIBLE_PDF env var.
resolution_paths:
  - "${PARALLEL_BIBLE_PDF}"  # env-var override (highest priority)
  - "../../project_maccabees_expansion/Bible_Amharic_and_Geez.pdf"  # publisher-supplied
  - "${HOME}/Documents/project_maccabees_expansion/Bible_Amharic_and_Geez.pdf"
  - "${USERPROFILE}/Documents/project_maccabees_expansion/Bible_Amharic_and_Geez.pdf"
  - "content/translations/sources/parallel-bible-eotc/Bible_Amharic_and_Geez.pdf"  # in-repo location if ever committed

# Provenance — where the publisher obtained the original.
archive_org_id: EOTXC_HOLYSCRIPTS_ALL_BOOKS
archive_org_url: https://archive.org/details/EOTXC_HOLYSCRIPTS_ALL_BOOKS
publisher_name: Ethiopian Orthodox Tewahedo Church
publisher_url: https://www.ethiopianorthodox.org/

# Structural map — known book-page ranges. EXPANDED as τ.6.x extraction
# proceeds book-by-book.
#
# IMPORTANT: page indices below are 0-INDEXED PDF page indices into
# `Bible_Amharic_and_Geez.pdf` (2,539 pages). They are NOT the same as
# the archive.org scan-page numbers used in
# `project_maccabees_expansion/01_MASTER_PLAN.md §3` (which refer to
# the 76-page Meqabyan_Geez_Amharic_parallel.pdf extract; that
# extract's indexing starts at 0 = the full PDF's scan-page 832 area).
#
# Originally seeded at τ.6.x.0a (2026-05-14) with just `meqabyan`
# (verified by 'መጽሐፈ መቃብያን' title-marker scan). Extended at Π.1
# (2026-05-14) to add the remaining Tewahedo-distinctive book sections
# (jubilees, one_enoch) discovered by 'መጽሐፈ ኩፋሌ' / 'መጽሐፈ ሄኖክ'
# title-marker scan + boundary-page text inspection. The laodiceans
# slot is declared but `present_in_pdf: false` — the Pauline Letter
# to the Laodiceans does NOT appear in this PDF's NT canon (verified
# by 'መልእክት ... ሎዶቅያ' marker-absence + boundary-page inspection in
# the NT section around pages 2000-2100). Further extended at Π.1.B
# (2026-05-14) to declare the laodiceans alternate source (Lightfoot
# 1875 primary + James 1924 + Codex Fuldensis secondary) in
# content/translations/sources/letter-to-laodiceans/_source.yaml;
# the laodiceans block now cross-references that alternate source
# via `alternate_source_id` + `alternate_source_file` fields.
structural_map:
  genesis:
    book_codes: [gen]
    pdf_page_range: [0, 85]
    pdf_index_offset: 0  # the values above are already 0-indexed
    verified: true
    verified_date: 2026-05-15
    verified_at_phase: τ.7.x.a
    chapter_count_expected: 50  # standard Genesis chapter count (Masoretic + LXX agreement)
    notes: |
      Verified at τ.7.x.a (2026-05-15) by scanning the FULL Bible
      PDF for Amharic Genesis markers. 'ኦሪት ዘልደት' (Geʽez Genesis
      title, U+12A6+U+1228+U+12CD+U+1275 + U+12D8+U+120D+U+12F0+U+1275)
      appears at page 0; 'በመጀመሪያ' (Amharic Gen 1:1 first word,
      "In the beginning") appears at page 0; 'ምዕራፍ ፩' (chapter 1
      marker with Ethiopic numeral ፩=1) appears at page 0.

      Boundary determined by Exodus start detection — 'ኦሪት ዘፀአት'
      title scan + boundary-page text inspection shows Exodus
      content begins on page 86 (top of page reads 'ዝ ውነቱ
      አስማቲሆሙ ለይቋቀ እስራኤል' = Ex 1:1 "These are the names of the
      sons of Israel"). The explicit 'ኦሪት ዘፀአት' header appears
      on page 88 (publisher convention puts the formal title later
      within the book, not at the opening page of Exodus 1 itself).

      Genesis occupies pages 0-85 = 86 pages for 50 chapters
      (~1.72 pages/chapter; consistent with the meqabyan density
      pattern of ~1.3-1.7 pages/chapter for two-column liturgical
      layout). First τ.7.x.a per-book ingest under D4-c Amharic-
      first sequencing per the τ.6.x.2.D D-decisions matrix. The
      pre-τ.7.x.a state was Π.0 seed (3 verses, Gen 1:1-3 only);
      τ.7.x.a upgrades amharic-tewahedo/gen.py to full-book OCR
      ingest at ocr-tier3 quality per τ.6.x.0b honesty contract.
      Geʽez column ingest is deferred to τ.6.x.2.a (the same
      Genesis page range, Geʽez column) under D4-c sequencing —
      see tau6x2D_decisions.derived_phase_ordering.

  exodus:
    book_codes: [ex]
    pdf_page_range: [86, 160]
    pdf_index_offset: 0  # values above are already 0-indexed
    verified: true
    verified_date: 2026-05-15
    verified_at_phase: τ.7.x.b
    chapter_count_expected: 40  # standard Exodus chapter count (Masoretic + LXX + Vulgate agreement)
    notes: |
      Verified at τ.7.x.b (2026-05-15) via per-page chapter-marker walk
      + content-boundary inspection of the Exodus→Leviticus transition.
      Marker hits: `ኦሪት ዘፀአት` (Geʽez Exodus title) FIRST appears at
      page 88 — publisher convention puts the formal title 2-3 pages
      INTO the book, NOT at the opening page (mirroring Genesis where
      `ኦሪት ዘልደት` appears at page 0 = start, but for Exodus the title
      appears at page 88, well past Exodus 1:1 content at page 86).
      Exodus 1:1 first words `ዝ ውነቱ አስማቲሆሙ` ("These are the names of
      the sons of Israel") appear at page 86 — the canonical Exodus
      start.

      End boundary determined by Exodus 40 → Leviticus 1 content
      inspection: page 160 reads `ደመናው ብርሃን ተነሥቶ ክልቕደ ግን ደመናው እስ
      ኪነሣላቸው ድረስ አይጓዙም ነበር` ("The cloud was lifted... but they
      did not journey until the cloud was taken up") — the LITERAL
      Exodus 40:36-38 closing narrative. Page 161 opens with `አግዚአብሔር
      ክደብተራ አሪ ውክጥ ዙኖ ሙሌን መርቶ` ("And the LORD called Moses out
      of the tabernacle") — the canonical Leviticus 1:1 opening.

      Exodus occupies pages 86-160 = 75 pages for 40 chapters
      (~1.875 pages/chapter; slightly higher density than Genesis's
      1.72 pages/chapter, consistent with Exodus having long tabernacle
      descriptions and plague narratives). Second τ.7.x per-book ingest
      under D4-c Amharic-first sequencing + D1-a per-book cadence per
      the τ.6.x.2.D D-decisions matrix. The pre-τ.7.x.b state was an
      EMPTY slot (no ex.py for amharic-tewahedo); τ.7.x.b creates
      amharic-tewahedo/ex.py at ocr-tier3 quality per τ.6.x.0b honesty
      contract. Geʽez column ingest is deferred to τ.6.x.2.b (the
      same Exodus page range, Geʽez column) under D4-c sequencing —
      see tau6x2D_decisions.derived_phase_ordering.

  leviticus:
    book_codes: [lev]
    pdf_page_range: [161, 213]
    pdf_index_offset: 0
    verified: true
    verified_date: 2026-05-15
    verified_at_phase: τ.7.x.c
    chapter_count_expected: 27
    notes: |
      Verified at τ.7.x.c (2026-05-15) via per-page chapter-marker
      walk pages 161-220 + content-boundary inspection of pages
      212-214. Leviticus 1:1 opening `አግዚአብሔር ክደብተራ አሪ ውክጥ ዙኖ
      ሙሌን መርቶ` ("And the LORD called Moses out of the
      tabernacle") confirmed at page 161 (publisher convention
      starts content WITHOUT formal `ኦሪት ዘሌዋውያን` title — the title
      hits much later on page 172 and onwards as a sub-page header
      banner). Leviticus 27:34 closing `እግዚ አብሔር በሱና በእስራኤል
      ልጆች መክከል በሲና ተራራ በሙሴ እጅ የሰጠው ቋግ ትእዛዝና ፍርድ ይሀ ው`
      ("These are the commandments which the LORD commanded Moses
      for the children of Israel on Mount Sinai") confirmed at
      page 212.

      End-boundary determined by Numbers transition at page 214:
      page 214 opens with `መጽሐፍ ይዘ ነው` ("This book is finished")
      + transitional banner `ኦሪት ዘፀአት የአበውን ቀጥር ይናገር አስት ሠለስቱ
      ምእአት ለመጻሕፍት ሁሉ አርአስት ሲሰጡ መ ዘሲና በውስተ ደብተራ መርጡል ብሎ
      ይጀምራል` (introducing the "father-numbering" book that begins
      "in Sinai in the tabernacle"), followed by `ምፅራፍ B፩።`
      (Numbers ch 1 marker, garbled) + the canonical Numbers 1:1
      opening `እስራኤል ከግብጽ አገር በወጡ በሁለተኛው ዓመት በሁለተኛው ወር
      መበቻ በሷና ምድረ በዳ ልዩ በሆነች ድንኳን አግዚአብሔር ሙሴን ተናገረው`
      ("In the second year after they came out of Egypt, on the
      first day of the second month, in the wilderness of Sinai,
      in the tabernacle the LORD spoke to Moses").

      Leviticus occupies pages 161-213 = 53 pages for 27 chapters
      (~1.96 pages/chapter; consistent with Tewahedo two-column
      density baseline 1.72-2.15 pages/chapter; Leviticus has many
      short laws + sacrifice rite chapters). Third τ.7.x per-book
      ingest under D4-c Amharic-first sequencing + D1-a per-book
      cadence. Geʽez column ingest deferred to τ.6.x.2.c (same
      Leviticus page range, Geʽez column) under D4-c sequencing.

  numbers:
    book_codes: [num]
    pdf_page_range: [214, 287]
    pdf_index_offset: 0
    verified: true
    verified_date: 2026-05-15
    verified_at_phase: τ.7.x.d
    chapter_count_expected: 36
    notes: |
      Verified at τ.7.x.d (2026-05-15) via per-page chapter-marker
      walk pages 214-291 + content-boundary inspection of pages
      287-289. Numbers 1:1 opening at page 214 confirmed by both:
      (a) the transitional banner `ኦሪት ዘፀአት የአበውን ቍጥር ይናገራል፣
      ኦሪት ዘጐልቍም የውሉድን ነገር ይናገራል` ("The book of Exodus speaks
      of the numbering of the fathers; the book of Numbers speaks
      of the offspring") — the publisher's prose introduction to
      the book of Numbers itself, derived from the Tewahedo title
      `ኦሪት ዘጐልቍ` ("the law of numbering"); and (b) the canonical
      Numbers 1:1 Geʽez column `ወነበቦ እግዚአብሔር ሙሴ በገዳም ዘሲና በውስተ
      ደብተራ ዘመርጡል` ("And the LORD spoke to Moses in the wilderness
      of Sinai, in the tabernacle of meeting") confirmed at page
      214 alongside the `ምዕራፍ ፩።` (chapter 1 marker, Ethiopic
      numeral ፩=1). This Tewahedo-distinctive prose-introduction
      pattern at Numbers 1:1 is NOT a Genesis/Exodus/Leviticus
      convention — only Numbers carries an explicit narrative
      explanation of the book's title-meaning at its opening page.

      End boundary determined by Numbers→Deuteronomy content
      inspection: page 287 closes Numbers with the daughters-of-
      Zelophehad inheritance narrative (Num 36 closing chapter:
      `ኣምሐዱ ኣሐዱ ኣምሄኔሆሙ ውስተ ርስቱ ጸቡቁ ሆሙ ይትልጢ ደቂቀ ኣስራኤል`
      "every one of the children of Israel shall keep himself to
      the inheritance of the tribe of his fathers"). Page 288
      opens Deuteronomy with `ምፅራፍ ፩` + Deut 1:1 Geʽez `ሣን ውክ
      ነገር ዘነገርሮሙ ሙሴ ፅዙሉ ኤልክ በማዕዶተ ዮርዳኖስ` ("These are the words
      which Moses spoke to all Israel beyond the Jordan"). The
      explicit `ኦሪት ዘዳግም` (Geʽez Deuteronomy title) banner FIRST
      appears at page 289 with the `ምዕራፍ ፩` marker — publisher
      convention puts the formal title 1-2 pages INTO Deuteronomy,
      mirroring the Exodus title-page-88 pattern (NOT the Genesis
      title-page-0 pattern). The Numbers→Deuteronomy boundary is
      therefore decisively at page 288 (Deut 1:1 opens at page 288;
      Numbers content ends at page 287).

      Numbers occupies pages 214-287 = 74 pages for 36 chapters
      (~2.06 pages/chapter; slightly denser than Leviticus's
      1.96 pages/chapter, consistent with Numbers's mix of long
      census-list chapters (Num 1, 2, 3, 4, 7, 26) and shorter
      narrative chapters (Num 12, 17, 27, 36) yielding a more
      content-dense average page). Fourth τ.7.x per-book ingest
      under D4-c Amharic-first sequencing + D1-a per-book cadence
      per the τ.6.x.2.D D-decisions matrix. The pre-τ.7.x.d state
      was an EMPTY slot (no num.py for amharic-tewahedo);
      τ.7.x.d creates amharic-tewahedo/num.py at ocr-tier3 quality
      per τ.6.x.0b honesty contract. Geʽez column ingest is
      deferred to τ.6.x.2.d (same Numbers page range, Geʽez
      column) under D4-c sequencing — see
      tau6x2D_decisions.derived_phase_ordering.

  deuteronomy:
    book_codes: [deu]
    pdf_page_range: [288, 348]
    pdf_index_offset: 0
    verified: true
    verified_date: 2026-05-15
    verified_at_phase: τ.7.x.e
    chapter_count_expected: 34
    notes: |
      Verified at τ.7.x.e (2026-05-15) via per-page chapter-marker
      walk pages 288-348 + content-boundary inspection of pages
      347-349. Deuteronomy 1:1 opening at page 288 confirmed by:
      (a) the `ምፅራፍ` chapter-marker preamble + canonical Deut 1:1
      Geʽez column `ሣን ውክ ነገር ዘነገርሮሙ ሙሴ ፅዙሉ ኤልክ በማዕዶሩ ዬርዳኖስ`
      ("These are the words which Moses spoke to all Israel beyond
      the Jordan, in the wilderness"); and (b) the explicit `ኦሪት
      ዘዳግም` (Geʽez Deuteronomy title) banner at page 289 paired
      with `ምፅራፍ ፩።` (chapter 1 marker, Ethiopic numeral ፩=1).
      Publisher convention puts the formal title 1 page INTO the
      book mirroring the Exodus title-page-88 pattern (NOT the
      Genesis title-page-0 pattern). The `ኦሪት ዘዳግም` title appears
      multiple times throughout the book as a running header.

      End boundary determined by Deuteronomy → Joshua content
      inspection: page 348 closes Deuteronomy with the Deut 34
      epilogue narrative — the death of Moses, the 30-day mourning
      period, and the canonical closing verses (Deut 34:5-12) "And
      Moses the servant of the LORD died there in the land of Moab
      ... and there arose not a prophet since in Israel like unto
      Moses, whom the LORD knew face to face". Page 348 also
      contains the Deut 34:9 note `ወኢያሱ ወልደ ነዌ ተመልአ መንፈስ ጥበብ`
      ("And Joshua the son of Nun was full of the spirit of
      wisdom"), preparing the Joshua succession. Page 349 opens
      with `ምፀራፍ` (chapter 1 marker) + canonical Joshua 1:1
      Geʽez `ወክነ እምድሣሪረ ሞተ ሙዜ ገብሪ እግዚአብሔር ቤሎ እግዚአብሔር
      ለኢያሱ ወልደ ነዌ ላአኩ ለሙሴ` ("And it came to pass after the
      death of Moses the servant of the LORD, that the LORD spake
      unto Joshua the son of Nun, Moses's minister") — the
      canonical Joshua book opening. The `መጽሐፈ ኢያሱ` (Book of
      Joshua) explicit title appears slightly later (page 290's
      title hit was inside Deut 1 forward-references; the proper
      Joshua book title comes after page 349). The Deut→Joshua
      boundary is therefore decisively at page 349 (Joshua 1:1
      opens at page 349; Deuteronomy content ends at page 348).

      Deuteronomy occupies pages 288-348 = 61 pages for 34 chapters
      (~1.79 pages/chapter; consistent with the Tewahedo two-column
      density baseline 1.72-2.15 pages/chapter; Deuteronomy has a
      mix of historical-rehearsal long chapters (Deut 1-3, 9, 28)
      and short blessing/curse chapters (Deut 27, 33, 34) yielding
      a moderate average page-density similar to Genesis's 1.72).
      Fifth τ.7.x per-book ingest under D4-c Amharic-first
      sequencing + D1-a per-book cadence per the τ.6.x.2.D
      D-decisions matrix. **τ.7.x.e CLOSES the §8.1 Pentateuch arc
      under Amharic-first sequencing** (gen + ex + lev + num + deut
      = all 5 books of Torah shipped in the amharic-tewahedo
      translation slot). The §8.1 arc-close convention codified at
      ω.41/γ.4.5.E (Jubilees-arc-close) and γ.4.8.E (Mäqabyan-arc-
      close) is the ninth §8.1 instance overall and the FIRST in the
      τ-cluster — establishing the per-book-cadence (D1-a) +
      Amharic-first-sequencing (D4-c) Pentateuch-arc-close as a
      durable structural pattern. The pre-τ.7.x.e state was an
      EMPTY slot (no deu.py for amharic-tewahedo); τ.7.x.e creates
      amharic-tewahedo/deu.py at ocr-tier3 quality per τ.6.x.0b
      honesty contract. Geʽez column ingest is deferred to τ.6.x.2.e
      (same Deuteronomy page range, Geʽez column) under D4-c
      sequencing — see tau6x2D_decisions.derived_phase_ordering.

