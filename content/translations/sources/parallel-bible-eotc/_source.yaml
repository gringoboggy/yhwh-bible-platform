      (the τ.6.x.1.B pilot showed Amharic OCR layout is noisier than
      Geʽez; tier-3→tier-2 escalation happens at operator cross-check).
    publisher_direction_resolved_at_phase: τ.6.x.2.D  # 2026-05-15 — see tau6x2D_decisions block below

  # τ.6.x.2.D D-DECISIONS — publisher-direction codification shipped
  # 2026-05-15. Resolves the four open D-decisions that gated
  # τ.6.x.2+ Geʽez bulk-ingest at ocr-tier3 (the next_phase pointer of
