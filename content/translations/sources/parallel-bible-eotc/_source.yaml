      ክደብተራ አሪ ውክጥ ዙኖ ሙሌን መርቶ` ("And the LORD called Moses out
      of the tabernacle") — the canonical Leviticus 1:1 opening.

      Exodus occupies pages 86-160 = 75 pages for 40 chapters
      (~1.875 pages/chapter; slightly higher density than Genesis's
      1.72 pages/chapter, consistent with Exodus having long tabernacle
      descriptions and plague narratives). Second τ.7.x per-book ingest
      under D4-c Amharic-first sequencing + D1-a per-book cadence per
      the τ.6.x.2.D D-decisions matrix. The pre-τ.7.x.b state was an
      EMPTY slot (no ex.py for amharic-tewahedo); τ.7.x.b creates
      amharic-tewahedo/ex.py at ocr-tier3 quality per τ.6.x.0b honesty
      contract. Geʽez column ingest is deferred to τ.6.x.2.b (the
      same Exodus page range, Geʽez column) under D4-c sequencing —
      see tau6x2D_decisions.derived_phase_ordering.

  leviticus:
    book_codes: [lev]
    pdf_page_range: [161, 213]
    pdf_index_offset: 0
    verified: true
    verified_date: 2026-05-15
    verified_at_phase: τ.7.x.c
