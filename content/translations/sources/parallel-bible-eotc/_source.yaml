      (proper) per the locked D4-c Amharic-first sequencing of the
      τ.6.x.2.D D-decisions matrix. The τ.6.x.1.D ship explicitly
      pre-committed the writer-side renumbering path:
      "Downstream τ.7.x.a writer may apply post-process renumbering
