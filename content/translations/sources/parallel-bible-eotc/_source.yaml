      source: dev/PILOT_TAU7XA_OUTPUT.md
      section: §4 EMPIRICAL FINDING
      flag: paragraph_mode_parser_extension_needed
      finding_phase: τ.7.x.a.0
      reciprocal_back_link: 'tau7xa_pre_pilot.finding_resolved_at_phase: τ.6.x.1.C'
    helpers_added:
      CROSS_REF_FRAGMENT_RE: |
        re.Pattern matching biblical-citation shape: optional 1-5-char
        Ethiopic book-abbreviation + period or comma + numeral run
        (Arabic or Ethiopic) + optional more numeral runs with
        Ethiopic separators (፡፣፤፥፦፧፨) + optional trailing separator.
      is_cross_ref_fragment: |
        Heuristic: returns True if a fragment is ≤30 chars AND
        matches CROSS_REF_FRAGMENT_RE OR has high numeral-coverage
        (>25% of non-whitespace characters are Arabic digits or
        Ethiopic numerals). Used to filter cross-reference fragments
        from verse output.
      GENESIS_VERSE_COUNTS: |
        Dict mapping chapter (1-50) → expected verse count
        (Masoretic + LXX agreement). Total = 1533 verses for
        Genesis. Used by callers (NOT the parser itself; the parser
        is single-responsibility extraction) to validate ingest
        quality against the expected floor.
      _parse_paragraph_mode: |
        Implementation function for paragraph-mode parsing. Walks
        chapter markers; within each chapter, splits text by `።`
        and filters cross-references; numbers verses sequentially.
    parser_api_change:
      function: parse_verses_from_text
      change: 'added keyword-only argument paragraph_mode: bool = False'
      backward_compatibility: |
