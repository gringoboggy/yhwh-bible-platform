        Sequential renumbering assigns parser verse i to canonical
        verse j in chapter k, but if the parser merged two source
        verses or dropped a fragment, the canonical j may name a
        verse whose CONTENT actually belongs to canonical j+1. The
        chapter+verse INDEX is canonical (matching reader expectation
        — Gen 1:1 lookup returns the FIRST extracted verse, which IS
        Gen 1:1 in source order); content alignment is the τ.6.x.3
        cross-check scope.
