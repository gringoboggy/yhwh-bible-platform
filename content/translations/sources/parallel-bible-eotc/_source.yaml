    known_residual_issues:
      coverage_short_by_226_verses: |
        85.3% coverage = 226 verses missing. Sources: (1) fragments
        below the 10-char filter (orphan punctuation, single chars);
        (2) verses merged across `።` boundaries where the OCR
        dropped the terminator; (3) cross-references consuming verse-
        text via `=` separator leakage. τ.6.x.3 batched audit per
        D2-b + D3-c will cross-check against KJV/LXX/BHS reference
        and flag specific verse alignments needing remediation.
      cross_reference_inline_leakage: |
        Cross-refs like `= ቀ. ፲፫ =` are inlined within verse text
        rather than line-prefixed; the is_cross_ref_fragment heuristic
        only filters per-fragment-after-split, so cross-refs sharing
        a `።`-bounded fragment with body text leak through. Visible
        in Gen 1:3 ingest: `… ኔለማን ለየ = ቀ. ፲፫ = እግዚአብሔር ብርሃኑን ቃን …`.
        Affects readability but not (ch, v) indexing.
      verse_text_misalignment_under_renumbering: |
        Sequential renumbering assigns parser verse i to canonical
        verse j in chapter k, but if the parser merged two source
        verses or dropped a fragment, the canonical j may name a
        verse whose CONTENT actually belongs to canonical j+1. The
        chapter+verse INDEX is canonical (matching reader expectation
        — Gen 1:1 lookup returns the FIRST extracted verse, which IS
        Gen 1:1 in source order); content alignment is the τ.6.x.3
        cross-check scope.
