      τ.7.x.e is the NINTH §8.1 arc-close instance overall. The eight
      prior §8.1 instances were all in the γ-cluster (Tewahedo
      patristic-and-canonical voice arcs):

      - γ.4.1.D — Cyril-on-John arc-close (4 detail waves; 116 entries)
      - γ.4.2.D — Ephrem-on-Pentateuch arc-close (4 waves; 117 entries)
      - γ.4.3.D — Cyril-on-Luke arc-close (4 waves; 160 entries)
      - γ.4.4.E — 1 Enoch arc-close (5 waves; 192 entries)
      - γ.4.5.E — Jubilees arc-close (5 waves; 200 entries)
      - γ.4.6.D — Cyril-on-Matthew arc-close (4 waves; ~155 entries)
      - γ.4.7.E — Cyril-on-Mark arc-close (5 waves; ~150 entries)
      - γ.4.8.E — Mäqabyan arc-close (5 waves; 200 entries; first
        100%-chapter-coverage arc; first Tewahedo-distinctive-
        canonical block parity at 30.71%)

      τ.7.x.e is the FIRST §8.1 arc-close in the τ-cluster
      (parallel-Bible translation infrastructure). It codifies a
      DIFFERENT structural pattern from the γ-cluster §8.1 instances:
      whereas the γ-cluster §8.1 arcs all use 4-5 detail-wave
      sequences within a single voice/book (γ.4.X seed + γ.4.X.B/C/D
      detail-waves + optional γ.4.X.E close), the τ-cluster §8.1
      arc-close is a per-book-cadence (D1-a) closure of a canonical
      unit — five books (gen + ex + lev + num + deut) each shipped
      as their own τ.7.x.{a,b,c,d,e} per-book ingest, with the fifth
      ingest closing the canonical Pentateuch unit.

      The τ-cluster §8.1 pattern is more granular (per-book) and
      less narrative (no detail-waves; each book is a single-ship
      sub-phase). It is therefore a STRUCTURAL §8.1 (closing a
      canonical unit by completing per-book coverage) rather than
      a NARRATIVE §8.1 (closing a thematic arc by detail-wave
      buildout). Both patterns share the property of marking the
      completion of a coherent unit (canonical book in γ-cluster;
      canonical book-cluster in τ-cluster) — the §8.1 convention
      generalizes cleanly to both.

      Pentateuch combined coverage at arc-close: 4945/5853 = 84.5%
      across all 5 books of Torah; 274 PDF pages consumed (0-348);
