# Source provenance — Parallel Geʽez–Amharic EOTC Bible
#
# This file documents the source PDF used by τ.6.x and τ.7.x for
# the parallel-Bible expansion. The PDF itself is NOT committed to
# the repository because (1) it is 202 MB which exceeds the
# project's binary-commit threshold without publisher authorization,
# and (2) it is publisher-supplied material that already lives in
# the user's local working directory.
#
# When the parallel-PDF extraction tool (scripts/extract_parallel_pdf.py)
# runs, it resolves the PDF path through the search order documented
# below. If the file cannot be found, the tool exits with a clear
# error message pointing here.

source_id: parallel-bible-eotc
description: |
  The parallel Geʽez–Amharic edition of the Ethiopian Orthodox
  Tewahedo Church (EOTC) Bible. 2,539 pages. Layout: Geʽez in the
  left column, Amharic in the right column, verse-aligned, with
  shared chapter headers (ምዕራፍ + Geʽez numeral). The same source
  the project_maccabees_expansion/ handoff package uses for the
  Phase-4 Geʽez-revision of Meqabyan; PROMOTED to the project's
  PRIMARY Geʽez + Amharic source at τ.6.x.0 (2026-05-14) after
  eBible.org's gez-Geez slot was verified removed.

primary_filename: Bible_Amharic_and_Geez.pdf
total_pages: 2539

# PDF size (bytes); checksum for integrity-verification.
expected_size_bytes: 202694977
expected_sha256: null  # populated at τ.6.x ship time

# Path resolution — the extractor tries these in order until one
# exists. Operator can override via PARALLEL_BIBLE_PDF env var.
resolution_paths:
  - "${PARALLEL_BIBLE_PDF}"  # env-var override (highest priority)
  - "../../project_maccabees_expansion/Bible_Amharic_and_Geez.pdf"  # publisher-supplied
  - "${HOME}/Documents/project_maccabees_expansion/Bible_Amharic_and_Geez.pdf"
  - "${USERPROFILE}/Documents/project_maccabees_expansion/Bible_Amharic_and_Geez.pdf"
  - "content/translations/sources/parallel-bible-eotc/Bible_Amharic_and_Geez.pdf"  # in-repo location if ever committed

# Provenance — where the publisher obtained the original.
archive_org_id: EOTXC_HOLYSCRIPTS_ALL_BOOKS
archive_org_url: https://archive.org/details/EOTXC_HOLYSCRIPTS_ALL_BOOKS
publisher_name: Ethiopian Orthodox Tewahedo Church
publisher_url: https://www.ethiopianorthodox.org/

# Structural map — known book-page ranges. EXPANDED as τ.6.x extraction
# proceeds book-by-book.
#
# IMPORTANT: page indices below are 0-INDEXED PDF page indices into
# `Bible_Amharic_and_Geez.pdf` (2,539 pages). They are NOT the same as
# the archive.org scan-page numbers used in
# `project_maccabees_expansion/01_MASTER_PLAN.md §3` (which refer to
# the 76-page Meqabyan_Geez_Amharic_parallel.pdf extract; that
# extract's indexing starts at 0 = the full PDF's scan-page 832 area).
#
# Originally seeded at τ.6.x.0a (2026-05-14) with just `meqabyan`
# (verified by 'መጽሐፈ መቃብያን' title-marker scan). Extended at Π.1
# (2026-05-14) to add the remaining Tewahedo-distinctive book sections
# (jubilees, one_enoch) discovered by 'መጽሐፈ ኩፋሌ' / 'መጽሐፈ ሄኖክ'
# title-marker scan + boundary-page text inspection. The laodiceans
# slot is declared but `present_in_pdf: false` — the Pauline Letter
# to the Laodiceans does NOT appear in this PDF's NT canon (verified
# by 'መልእክት ... ሎዶቅያ' marker-absence + boundary-page inspection in
# the NT section around pages 2000-2100).
structural_map:
  meqabyan:
    book_codes: [mq1, mq2, mq3]
    pdf_page_range: [1318, 1378]
    pdf_index_offset: 0  # the values above are already 0-indexed
    verified: true
    verified_date: 2026-05-14
    verified_at_phase: τ.6.x.0a
    subsections:
      # Per-book sub-ranges within the meqabyan section. Hoisted from
      # the heuristic dict in extract_parallel_pdf.py at Π.1 so the
      # tool can consume them declaratively rather than via a code
      # fallback (the heuristic remains as a safety net).
      mq1: [1318, 1365]
      mq2: [1366, 1372]
      mq3: [1373, 1378]
    notes: |
      Verified at τ.6.x.0a (2026-05-14) by scanning the FULL Bible
      PDF for book-title markers. The full PDF is 2,539 pages with
      Genesis at page 0; Meqabyan occupies pages 1318-1378
      (approximately; book boundaries within the section confirmed
      by the 'መጽሐፈ መቃብያን ቀዳማዊ/ካልዕ/ሣልስ' title-marker scan).

      Sub-ranges within meqabyan (publisher convention):
        1 Mq = pages 1318-1365 (36 chapters) — opens at 1318 with
               'መጽሐፈ • መቃብያን ፡ ቀዳማዊ'
        2 Mq = pages 1366-1372 (21 chapters) — opens at 1366 with
               'መጽሐፈ ፣ መቃብያን ፣ ክልፅ' (Meqabyan II / 'second')
        3 Mq = pages 1373-1378 (10 chapters) — opens at 1373 with
               'መጽሐፈ ፣ መቃብያን • ሣልስ' (Meqabyan III / 'third')

      Note: the 76-page Meqabyan_Geez_Amharic_parallel.pdf extract
      uses a different page numbering (scan pages 832-907 from the
      archive.org metadata). For τ.6.x.0a we use the FULL PDF's
      0-indexed pages because that PDF is the publisher's primary
      submitted file.

  jubilees:
    book_codes: [jub]
    pdf_page_range: [1454, 1514]
    pdf_index_offset: 0
    verified: tentative
    verified_date: 2026-05-14
    verified_at_phase: Π.1
    chapter_count_expected: 50
    notes: |
      Discovered at Π.1 (2026-05-14) by scanning for 'መጽሐፈ ኩፋሌ'
      title markers and inspecting boundary pages. Page 1453 closes
      the Daniel additions ('ተረፈ ዳንኤል' on page 1452); page 1454
      opens with 'መጽሐፈ ኩፉሌ' (jub title); pages 1454-1514 = 61 pages
      for 50 chapters (~1.22 pages/chapter; consistent with meqabyan
      density). Page 1515 transitions to 1 Enoch.

      The 'tentative' verification flag indicates the boundary pages
      were inspected but full chapter-by-chapter coverage has not
      yet been confirmed; that verification lands when production
      extraction begins (τ.6.x.1+ or δ.1.x-equivalent for jub).

  one_enoch:
    book_codes: [1en]
    pdf_page_range: [1515, 1566]
    pdf_index_offset: 0
    verified: tentative
    verified_date: 2026-05-14
    verified_at_phase: Π.1
    chapter_count_expected: 108  # R.H. Charles 1912 chapter count
    notes: |
      Discovered at Π.1 (2026-05-14) by scanning for 'መጽሐፈ ሄኖክ'
      title markers and inspecting boundary pages. Page 1514 closes
      jubilees ('መጽሐፈ ኩፋሌ' last marker); page 1515 opens with
      OCR-garbled 'መጽ ሓራፈ ቸዓክ' (cleanly 'መጽሐፈ ሄኖክ' on subsequent
      pages 1517, 1518); pages 1515-1566 = 52 pages for 108 chapters
      (~0.48 pages/chapter; denser than meqabyan because 1 Enoch
      chapters are short — many ≤10 verses). Page 1567 transitions
      to Matthew Gospel ('ብሥራተ ማቴዎስ ሐዋርያ').

      The 'tentative' verification flag matches jubilees — boundary
      pages confirmed, full coverage TBD. The 108-chapter expectation
      follows R.H. Charles 1912 (the standard Western edition that
      γ.4 references).

  laodiceans:
    book_codes: [lao]
    pdf_page_range: null
    pdf_index_offset: 0
    verified: false
    verified_date: 2026-05-14
    verified_at_phase: Π.1
    present_in_pdf: false
    alternate_source_required: true
    notes: |
      Searched at Π.1 (2026-05-14) for the Pauline Letter to the
      Laodiceans by scanning every page for 'መልእክት ... ሎዶቅያ'
      (Letter to Laodicea) and the related 'ዘወደ ሎዶቅያ' construction.
      ZERO opening-title matches found.

      The 4 pages containing 'ሎዶቅያ' are all secondary references:
        - page 2004: 'በሎዶቅያ ተጽፋ' ('written from Laodicea' —
                     subscript note at the end of another epistle)
        - page 2077: 'በሎዶቅያ' in the seven-churches list (Rev 1:11)
        - page 2080: 'መልኳከ ቤተ ከርስቲያን ዛዘሎዶቅያ' (Rev 3:14 angel-of-
                     the-Laodicean-church header — INSIDE Revelation,
                     not the Pauline Letter to the Laodiceans)
        - page 2284: 'ወበሎዶቅያ አርካቦስ' (geographic reference)

      The EOTC's parallel-Bible PDF used by this project does NOT
      include the Pauline Letter to the Laodiceans as a standalone
      book. The EOTC's NT canon as printed in this volume includes
      the standard 27-book NT only; the Letter to the Laodiceans is
      sometimes (but not consistently) included in the EOTC's
      broader canon.

      Π.1 conclusion: the laodiceans (lao) slot remains DECLARED in
      this structural_map for future expansion BUT requires an
      ALTERNATE SOURCE. Possible alternates:
        - Marius Mercator's Latin recension (Vulgate Codex Fuldensis)
        - The Geneva 1599 English rendering (PD; available from
          archive.org / Christian Classics Ethereal Library)
        - Augustine of Hippo's commentary citations (partial)
      Acquisition + verification gates on operator review per the
      `feedback_license_flagging` memory protocol.

  # Translation slot meta — used by the Π.1 declarative-pin tests.
  # Each entry confirms that a Tewahedo-distinctive book is REGISTERED
  # in this structural map even if extraction has not yet run.
  tewahedo_distinctive_inventory:
    declared_sections: [meqabyan, jubilees, one_enoch, laodiceans]
    book_codes_total: [mq1, mq2, mq3, jub, 1en, lao]
    declared_at_phase: Π.1
    declared_date: 2026-05-14
    extraction_status_at_declaration:
      meqabyan: not-yet-extracted  # τ.6.x.0a built the tool; δ.1.x will use Phase-4 page-image method
      jubilees: not-yet-extracted  # τ.6.x.1+ ocr-tier3 baseline; phase4-page-image escalation if needed
      one_enoch: not-yet-extracted  # same as jubilees
      laodiceans: source-unavailable  # alternate source required (per `laodiceans.notes`)
    contract: |
      Π.1 is a FOUNDATION phase — it DECLARES the slot inventory
      without populating it. Extraction proceeds in subsequent
      phases per the SCOPE_2026-05-14-parallel-bible.md roadmap:
      meqabyan via δ.1.x (Phase-4 page-image); jubilees + one_enoch
      via τ.6.x.1+ (Tesseract baseline) or δ.1.x-equivalent escalation
      (Phase-4 page-image) if OCR quality is insufficient; laodiceans
      via alternate-source acquisition (operator-side, gated on the
      `feedback_license_flagging` protocol).

  # All other books still TBD — expanded as τ.6.x extraction proceeds.
  # The publisher's parallel PDF starts at Genesis (page 0) and
  # continues through the EOTC canon. Approximate book starts to be
  # determined empirically book-by-book as ingestion proceeds.

# OCR caveats — see project_maccabees_expansion/05_GEEZ_REFERENCE.md §5
ocr_caveats: |
  The PDF has an OCR text layer but it is BADLY GARBLED for Geʽez:
  - Wrong vowel orders selected by the OCR
  - Invented fidel that aren't on the page (e.g. ወገብረ → ወንዳረ ቘልፌኤቱ)
  - Latin/English page-header text bleeds into the Geʽez column at margins
  - Geʽez numerals (overlined) frequently dropped or mis-read

  The Amharic OCR is acceptable in places but also has errors.

  Per the project_maccabees_expansion/02_METHODOLOGY.md §2 the
  AUTHORITATIVE source is the page image at 350 dpi, NOT the OCR
  text layer. The extraction tool tags every entry with a
  source_quality field reflecting whether it was page-image-
  verified or OCR-only.

source_quality_tiers:
  ocr_tier3: "PDF OCR text layer — flagged for review; quality varies by page; Geʽez is unreliable"
  ocr_tier2: "PDF OCR with operator cross-check against page image — acceptable for non-Meqabyan books"
  page_image_tier1: "Page-image verified per Phase-4 methodology — production quality; required for Meqabyan and Tewahedo-distinctive books"

# OCR-quality strategy — codified at τ.6.x.0b (2026-05-14) per
# dev/SCOPE_2026-05-14-parallel-bible.md §7.5 τ.6.x.0b decision block.
# Option D (Hybrid) is AUTHORIZED as the project default; Option B
# (Cloud OCR) remains available as opt-in publisher escalation.
ocr_strategy:
  authorized_option: D-Hybrid
  authorized_at_phase: τ.6.x.0b
  authorized_date: 2026-05-14
  default_engine: tesseract  # Option A as the tier-3 sub-strategy
  cloud_ocr_escalation_available: true  # Option B opt-in, requires publisher direction
  honesty_contract: |
    Every tier-3 entry MUST carry SOURCE_QUALITY="ocr-tier3" provenance.
    The reader-facing note list MUST surface a per-entry caveat
    ("OCR-derived; awaiting operator cross-check") for tier-3 entries.
    Tier-2 and tier-1 entries carry no caveat.
    This contract is non-negotiable per the parallel-Bible plan §4.1
    "Geʽez source matrix" provenance rule.

  # Tier-policy by book / language stream.
  tier_policy:
    meqabyan:
      books: [mq1, mq2, mq3]
      target_tier: page-image-tier1
      path: phase4-page-image-manual
      shipping_phase: δ.1.x
    one_enoch:
      books: [1en]
      target_tier: page-image-tier1
      path: phase4-page-image-manual
      shipping_phase: δ.1.x
    jubilees:
      books: [jub]
      target_tier: page-image-tier1
      path: phase4-page-image-manual
      shipping_phase: δ.1.x
    standard_canon_66:
      books: all-other-standard-canon
      baseline_tier: ocr-tier3
      upgrade_tier: ocr-tier2  # via operator cross-check
      path: tesseract-via-extract-parallel-pdf
      shipping_phase: τ.6.x.1+
    other_tewahedo_distinctive:
      books: all-other-tewahedo-distinctive
      baseline_tier: ocr-tier3
      escalation: phase4-page-image-manual if-unworkable
      path: tesseract-first
      shipping_phase: τ.6.x.1+
    amharic_parallel:
      books: all-amharic-slot
      baseline_tier: ocr-tier3
      upgrade_tier: ocr-tier2
      path: tesseract-via-extract-parallel-pdf
      shipping_phase: τ.7.x
      notes: |
        Amharic OCR is "acceptable in places" per ocr_caveats above;
        the upgrade-to-tier-2 cross-check is operator-mediated.

  # Load-bearing user-side prerequisites flagged per memory
  # feedback_license_flagging (default = continue most-logical-path;
  # flag external installs/licenses when load-bearing for next ship).
  # These are gates on the τ.6.x.1+ bulk-ingest phase, NOT on τ.6.x.0b
  # itself (which is decision-codification only).
  prerequisites:
    tesseract_install:
      required_for: τ.6.x.1+
      status_at_ship: not-installed-on-dev-workstation
      verification_method: 'where tesseract.exe + tesseract --version (both not-found at 2026-05-14)'
      license: Apache-2.0
      cost: none  # free, no per-seat / per-use spend
      publisher_authorization_needed: false
      install_paths:
        windows: 'UB-Mannheim https://github.com/UB-Mannheim/tesseract/wiki OR choco install tesseract'
        macos: 'brew install tesseract tesseract-lang'
        linux: 'apt-get install tesseract-ocr tesseract-ocr-amh'

    amharic_tessdata:
      required_for: τ.6.x.1+ amharic-slot ingest + standard-canon Amharic-column ingest
      file: amh.traineddata
      upstream_repos:
        - https://github.com/tesseract-ocr/tessdata_fast
        - https://github.com/tesseract-ocr/tessdata_best
      license: Apache-2.0
      cost: none
      publisher_authorization_needed: false

    geez_tessdata:
      required_for: τ.6.x.1+ geez-slot ingest where tesseract path is selected
      file: gez.traineddata
      status_at_ship: AVAILABILITY-UNCERTAIN
      verification_method: |
        Check upstream tessdata-fast + tessdata-best index for `gez`
        entry as of operator's install date; if absent, search
        community forks (HornMorpho, ethio-tesseract derivatives) and
        verify license + quality before adopting.
      fallback_if_missing:
        option_a: skip-geez-column-emit-amharic-only-slot
        option_b: defer-book-to-δ.1.x-phase4
        operator_chooses_via: '--geez-fallback {skip,phase4-defer} flag (added at τ.6.x.0c)'

    cloud_ocr_escalation:
      required_for: opt-in only — Option B sub-strategy
      providers_available: [google-cloud-vision, azure-cognitive-services, aws-textract]
      license: per-API-spend
      cost: variable — operator must authorize the spend
      publisher_authorization_needed: true  # gates on explicit publisher direction
      not_active_in_default_path: true

  # Translation-slot guarantee — preserved from τ.6.x.0a contract.
  no_ingest_at_this_phase: true
  translation_slot_state: 'remains-at-Π.0-seed-Genesis-only'
  geez_tewahedo_slot_seed_verse_count: 3
  amharic_tewahedo_slot_seed_verse_count: 3

  # Next-phase pointer.
  next_phase: τ.6.x.0c
  next_phase_description: |
    User-side: install Tesseract + amh.traineddata + verify gez.traineddata
    availability. The operator runs `tesseract --list-langs` to confirm
    `amh` is present and to record whether `gez` is present or absent.
    The verification result feeds into the extract_parallel_pdf.py
    invocation flags. ONLY after τ.6.x.0c completes does τ.6.x.1+
    bulk-ingest begin.
