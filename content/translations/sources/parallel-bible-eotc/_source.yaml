      jubilees: not-yet-extracted
      one_enoch: not-yet-extracted
      laodiceans: alternate-source-declared  # Π.1.B (2026-05-14): Lightfoot 1875 + James 1924 + Codex Fuldensis declared in content/translations/sources/letter-to-laodiceans/_source.yaml
    extraction_status_current_updated_at_phase: Π.1.B
    extraction_status_current_updated_date: 2026-05-14
    extraction_status_phase_history:
