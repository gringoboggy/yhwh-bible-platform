      cross_reference_inline_leakage: |
        Cross-refs like `= ቀ. ፲፫ =` are inlined within verse text
        rather than line-prefixed; the is_cross_ref_fragment heuristic
        only filters per-fragment-after-split, so cross-refs sharing
        a `።`-bounded fragment with body text leak through. Visible
        in Gen 1:3 ingest: `… ኔለማን ለየ = ቀ. ፲፫ = እግዚአብሔር ብርሃኑን ቃን …`.
