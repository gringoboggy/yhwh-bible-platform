  # `is_cross_ref_fragment` heuristic, numbers verses sequentially
  # within each chapter. Pin tests in tests/test_parallel_bible_
  # tau6x1.py::TestTau6X1C* classes.
  tau6x1c_parser_extension:
    shipped_at_phase: τ.6.x.1.C
    shipped_date: 2026-05-15
    triggered_by: |
      user "continue in the most logical way you think fit" after
      τ.7.x.a.0 PILOT (which surfaced the
      paragraph_mode_parser_extension_needed finding). Per memory
      `feedback_continue_not_save` (continue = advance) +
      `feedback_extensive_answers` (broadest scope).
