      with `ምፅራፍ ፩።` (chapter 1 marker, Ethiopic numeral ፩=1).
      Publisher convention puts the formal title 1 page INTO the
      book mirroring the Exodus title-page-88 pattern (NOT the
      Genesis title-page-0 pattern). The `ኦሪት ዘዳግም` title appears
      multiple times throughout the book as a running header.

      End boundary determined by Deuteronomy → Joshua content
      inspection: page 348 closes Deuteronomy with the Deut 34
      epilogue narrative — the death of Moses, the 30-day mourning
      period, and the canonical closing verses (Deut 34:5-12) "And
      Moses the servant of the LORD died there in the land of Moab
      ... and there arose not a prophet since in Israel like unto
      Moses, whom the LORD knew face to face". Page 348 also
      contains the Deut 34:9 note `ወኢያሱ ወልደ ነዌ ተመልአ መንፈስ ጥበብ`
      ("And Joshua the son of Nun was full of the spirit of
      wisdom"), preparing the Joshua succession. Page 349 opens
      with `ምፀራፍ` (chapter 1 marker) + canonical Joshua 1:1
      Geʽez `ወክነ እምድሣሪረ ሞተ ሙዜ ገብሪ እግዚአብሔር ቤሎ እግዚአብሔር
      ለኢያሱ ወልደ ነዌ ላአኩ ለሙሴ` ("And it came to pass after the
      death of Moses the servant of the LORD, that the LORD spake
      unto Joshua the son of Nun, Moses's minister") — the
      canonical Joshua book opening. The `መጽሐፈ ኢያሱ` (Book of
      Joshua) explicit title appears slightly later (page 290's
      title hit was inside Deut 1 forward-references; the proper
      Joshua book title comes after page 349). The Deut→Joshua
      boundary is therefore decisively at page 349 (Joshua 1:1
      opens at page 349; Deuteronomy content ends at page 348).

      Deuteronomy occupies pages 288-348 = 61 pages for 34 chapters
      (~1.79 pages/chapter; consistent with the Tewahedo two-column
      density baseline 1.72-2.15 pages/chapter; Deuteronomy has a
      mix of historical-rehearsal long chapters (Deut 1-3, 9, 28)
      and short blessing/curse chapters (Deut 27, 33, 34) yielding
      a moderate average page-density similar to Genesis's 1.72).
      Fifth τ.7.x per-book ingest under D4-c Amharic-first
      sequencing + D1-a per-book cadence per the τ.6.x.2.D
      D-decisions matrix. **τ.7.x.e CLOSES the §8.1 Pentateuch arc
      under Amharic-first sequencing** (gen + ex + lev + num + deut
      = all 5 books of Torah shipped in the amharic-tewahedo
      translation slot). The §8.1 arc-close convention codified at
      ω.41/γ.4.5.E (Jubilees-arc-close) and γ.4.8.E (Mäqabyan-arc-
      close) is the ninth §8.1 instance overall and the FIRST in the
      τ-cluster — establishing the per-book-cadence (D1-a) +
      Amharic-first-sequencing (D4-c) Pentateuch-arc-close as a
      durable structural pattern. The pre-τ.7.x.e state was an
      EMPTY slot (no deu.py for amharic-tewahedo); τ.7.x.e creates
      amharic-tewahedo/deu.py at ocr-tier3 quality per τ.6.x.0b
      honesty contract. Geʽez column ingest is deferred to τ.6.x.2.e
      (same Deuteronomy page range, Geʽez column) under D4-c
      sequencing — see tau6x2D_decisions.derived_phase_ordering.

