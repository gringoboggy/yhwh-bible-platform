        Function (verses, verse_counts) → renumbered verses. Discards
        parser chapter labels and assigns verses sequentially to
        canonical chapters per the verse_counts floor (e.g.
        GENESIS_VERSE_COUNTS). Source order is preserved during
        redistribution. Overflow verses (when parser produces more
        than the floor) end up in synthesized ch_max+1 bucket.
        Module-level pure function; works for any book once its
        canonical verse-count dict is supplied.
      write_book_module_extensions: |
        ingest_phase + docstring_extra kwargs (keyword-only). The
        ingest_phase tag is recorded as INGEST_PHASE constant in the
        generated module + referenced in the file docstring. The
        docstring_extra string is appended after the generic provenance
