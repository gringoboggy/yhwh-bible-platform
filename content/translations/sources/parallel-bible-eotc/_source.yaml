    translation_slot_state: 'remains-at-Π.0-seed-Genesis-only (τ.6.x.0a contract preserved across τ.6.x.0a → τ.6.x.0b → τ.6.x.0c → τ.6.x.1 → τ.6.x.1.A → τ.6.x.1.B → τ.6.x.2.D → τ.7.x.a.0 → τ.6.x.1.C → τ.6.x.1.D chain)'
    next_phase: τ.7.x.a
