        Verses without intervening `።` between them get merged
        into one. Example: Gen 1:1 + 1:2 in text-layer output
        sometimes lack the `።` after "ምድርን ፈጠረ" so they merge
        into a single ~150-char "verse 1". Acceptable at ocr-tier3
        per τ.6.x.0b honesty contract; τ.6.x.3 audit cross-check
        will catch + reflag these.
      short_fragment_filter: |
        The 10-char minimum filter eliminates orphan OCR noise but
        also eliminates legitimately-short verse fragments (rare in
        Genesis but more common elsewhere). Threshold may need
        adjustment at τ.6.x.1.D refinement.
