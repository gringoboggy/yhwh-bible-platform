# Source provenance — Parallel Geʽez–Amharic EOTC Bible
#
# This file documents the source PDF used by τ.6.x and τ.7.x for
# the parallel-Bible expansion. The PDF itself is NOT committed to
# the repository because (1) it is 202 MB which exceeds the
# project's binary-commit threshold without publisher authorization,
# and (2) it is publisher-supplied material that already lives in
# the user's local working directory.
#
# When the parallel-PDF extraction tool (scripts/extract_parallel_pdf.py)
# runs, it resolves the PDF path through the search order documented
# below. If the file cannot be found, the tool exits with a clear
# error message pointing here.

source_id: parallel-bible-eotc
description: |
  The parallel Geʽez–Amharic edition of the Ethiopian Orthodox
  Tewahedo Church (EOTC) Bible. 2,539 pages. Layout: Geʽez in the
  left column, Amharic in the right column, verse-aligned, with
  shared chapter headers (ምዕራፍ + Geʽez numeral). The same source
  the project_maccabees_expansion/ handoff package uses for the
  Phase-4 Geʽez-revision of Meqabyan; PROMOTED to the project's
  PRIMARY Geʽez + Amharic source at τ.6.x.0 (2026-05-14) after
  eBible.org's gez-Geez slot was verified removed.

primary_filename: Bible_Amharic_and_Geez.pdf
total_pages: 2539

# PDF size (bytes); checksum for integrity-verification.
expected_size_bytes: 202694977
expected_sha256: null  # populated at τ.6.x ship time

# Path resolution — the extractor tries these in order until one
# exists. Operator can override via PARALLEL_BIBLE_PDF env var.
resolution_paths:
  - "${PARALLEL_BIBLE_PDF}"  # env-var override (highest priority)
  - "../../project_maccabees_expansion/Bible_Amharic_and_Geez.pdf"  # publisher-supplied
  - "${HOME}/Documents/project_maccabees_expansion/Bible_Amharic_and_Geez.pdf"
  - "${USERPROFILE}/Documents/project_maccabees_expansion/Bible_Amharic_and_Geez.pdf"
  - "content/translations/sources/parallel-bible-eotc/Bible_Amharic_and_Geez.pdf"  # in-repo location if ever committed

# Provenance — where the publisher obtained the original.
archive_org_id: EOTXC_HOLYSCRIPTS_ALL_BOOKS
archive_org_url: https://archive.org/details/EOTXC_HOLYSCRIPTS_ALL_BOOKS
publisher_name: Ethiopian Orthodox Tewahedo Church
publisher_url: https://www.ethiopianorthodox.org/

# Structural map — known book-page ranges. EXPANDED as τ.6.x extraction
# proceeds book-by-book.
#
# IMPORTANT: page indices below are 0-INDEXED PDF page indices into
# `Bible_Amharic_and_Geez.pdf` (2,539 pages). They are NOT the same as
# the archive.org scan-page numbers used in
# `project_maccabees_expansion/01_MASTER_PLAN.md §3` (which refer to
# the 76-page Meqabyan_Geez_Amharic_parallel.pdf extract; that
# extract's indexing starts at 0 = the full PDF's scan-page 832 area).
#
# Originally seeded at τ.6.x.0a (2026-05-14) with just `meqabyan`
# (verified by 'መጽሐፈ መቃብያን' title-marker scan). Extended at Π.1
# (2026-05-14) to add the remaining Tewahedo-distinctive book sections
# (jubilees, one_enoch) discovered by 'መጽሐፈ ኩፋሌ' / 'መጽሐፈ ሄኖክ'
# title-marker scan + boundary-page text inspection. The laodiceans
# slot is declared but `present_in_pdf: false` — the Pauline Letter
# to the Laodiceans does NOT appear in this PDF's NT canon (verified
# by 'መልእክት ... ሎዶቅያ' marker-absence + boundary-page inspection in
# the NT section around pages 2000-2100). Further extended at Π.1.B
# (2026-05-14) to declare the laodiceans alternate source (Lightfoot
# 1875 primary + James 1924 + Codex Fuldensis secondary) in
# content/translations/sources/letter-to-laodiceans/_source.yaml;
# the laodiceans block now cross-references that alternate source
# via `alternate_source_id` + `alternate_source_file` fields.
structural_map:
  genesis:
    book_codes: [gen]
    pdf_page_range: [0, 85]
    pdf_index_offset: 0  # the values above are already 0-indexed
    verified: true
    verified_date: 2026-05-15
    verified_at_phase: τ.7.x.a
    chapter_count_expected: 50  # standard Genesis chapter count (Masoretic + LXX agreement)
    notes: |
      Verified at τ.7.x.a (2026-05-15) by scanning the FULL Bible
      PDF for Amharic Genesis markers. 'ኦሪት ዘልደት' (Geʽez Genesis
      title, U+12A6+U+1228+U+12CD+U+1275 + U+12D8+U+120D+U+12F0+U+1275)
      appears at page 0; 'በመጀመሪያ' (Amharic Gen 1:1 first word,
      "In the beginning") appears at page 0; 'ምዕራፍ ፩' (chapter 1
      marker with Ethiopic numeral ፩=1) appears at page 0.

      Boundary determined by Exodus start detection — 'ኦሪት ዘፀአት'
      title scan + boundary-page text inspection shows Exodus
      content begins on page 86 (top of page reads 'ዝ ውነቱ
      አስማቲሆሙ ለይቋቀ እስራኤል' = Ex 1:1 "These are the names of the
      sons of Israel"). The explicit 'ኦሪት ዘፀአት' header appears
      on page 88 (publisher convention puts the formal title later
      within the book, not at the opening page of Exodus 1 itself).

      Genesis occupies pages 0-85 = 86 pages for 50 chapters
      (~1.72 pages/chapter; consistent with the meqabyan density
      pattern of ~1.3-1.7 pages/chapter for two-column liturgical
      layout). First τ.7.x.a per-book ingest under D4-c Amharic-
      first sequencing per the τ.6.x.2.D D-decisions matrix. The
      pre-τ.7.x.a state was Π.0 seed (3 verses, Gen 1:1-3 only);
      τ.7.x.a upgrades amharic-tewahedo/gen.py to full-book OCR
      ingest at ocr-tier3 quality per τ.6.x.0b honesty contract.
      Geʽez column ingest is deferred to τ.6.x.2.a (the same
      Genesis page range, Geʽez column) under D4-c sequencing —
      see tau6x2D_decisions.derived_phase_ordering.

  meqabyan:
    book_codes: [mq1, mq2, mq3]
    pdf_page_range: [1318, 1378]
    pdf_index_offset: 0  # the values above are already 0-indexed
    verified: true
    verified_date: 2026-05-14
    verified_at_phase: τ.6.x.0a
    subsections:
      # Per-book sub-ranges within the meqabyan section. Hoisted from
      # the heuristic dict in extract_parallel_pdf.py at Π.1 so the
      # tool can consume them declaratively rather than via a code
      # fallback (the heuristic remains as a safety net).
      mq1: [1318, 1365]
      mq2: [1366, 1372]
      mq3: [1373, 1378]
    notes: |
      Verified at τ.6.x.0a (2026-05-14) by scanning the FULL Bible
      PDF for book-title markers. The full PDF is 2,539 pages with
      Genesis at page 0; Meqabyan occupies pages 1318-1378
      (approximately; book boundaries within the section confirmed
      by the 'መጽሐፈ መቃብያን ቀዳማዊ/ካልዕ/ሣልስ' title-marker scan).

      Sub-ranges within meqabyan (publisher convention):
        1 Mq = pages 1318-1365 (36 chapters) — opens at 1318 with
               'መጽሐፈ • መቃብያን ፡ ቀዳማዊ'
        2 Mq = pages 1366-1372 (21 chapters) — opens at 1366 with
               'መጽሐፈ ፣ መቃብያን ፣ ክልፅ' (Meqabyan II / 'second')
        3 Mq = pages 1373-1378 (10 chapters) — opens at 1373 with
               'መጽሐፈ ፣ መቃብያን • ሣልስ' (Meqabyan III / 'third')

      Note: the 76-page Meqabyan_Geez_Amharic_parallel.pdf extract
      uses a different page numbering (scan pages 832-907 from the
      archive.org metadata). For τ.6.x.0a we use the FULL PDF's
      0-indexed pages because that PDF is the publisher's primary
      submitted file.

  jubilees:
    book_codes: [jub]
    pdf_page_range: [1454, 1514]
    pdf_index_offset: 0
    verified: tentative
    verified_date: 2026-05-14
    verified_at_phase: Π.1
    chapter_count_expected: 50
    notes: |
      Discovered at Π.1 (2026-05-14) by scanning for 'መጽሐፈ ኩፋሌ'
      title markers and inspecting boundary pages. Page 1453 closes
      the Daniel additions ('ተረፈ ዳንኤል' on page 1452); page 1454
      opens with 'መጽሐፈ ኩፉሌ' (jub title); pages 1454-1514 = 61 pages
      for 50 chapters (~1.22 pages/chapter; consistent with meqabyan
      density). Page 1515 transitions to 1 Enoch.

      The 'tentative' verification flag indicates the boundary pages
      were inspected but full chapter-by-chapter coverage has not
      yet been confirmed; that verification lands when production
      extraction begins (τ.6.x.1+ or δ.1.x-equivalent for jub).

  one_enoch:
    book_codes: [1en]
    pdf_page_range: [1515, 1566]
    pdf_index_offset: 0
    verified: tentative
    verified_date: 2026-05-14
    verified_at_phase: Π.1
    chapter_count_expected: 108  # R.H. Charles 1912 chapter count
    notes: |
      Discovered at Π.1 (2026-05-14) by scanning for 'መጽሐፈ ሄኖክ'
      title markers and inspecting boundary pages. Page 1514 closes
      jubilees ('መጽሐፈ ኩፋሌ' last marker); page 1515 opens with
      OCR-garbled 'መጽ ሓራፈ ቸዓክ' (cleanly 'መጽሐፈ ሄኖክ' on subsequent
      pages 1517, 1518); pages 1515-1566 = 52 pages for 108 chapters
      (~0.48 pages/chapter; denser than meqabyan because 1 Enoch
      chapters are short — many ≤10 verses). Page 1567 transitions
      to Matthew Gospel ('ብሥራተ ማቴዎስ ሐዋርያ').

      The 'tentative' verification flag matches jubilees — boundary
      pages confirmed, full coverage TBD. The 108-chapter expectation
      follows R.H. Charles 1912 (the standard Western edition that
      γ.4 references).

  laodiceans:
    book_codes: [lao]
    pdf_page_range: null
    pdf_index_offset: 0
    verified: false
    verified_date: 2026-05-14
    verified_at_phase: Π.1
    present_in_pdf: false
    alternate_source_required: true
    alternate_source_declared: true  # Π.1.B fulfillment of the alternate_source_required flag
    alternate_source_declared_at_phase: Π.1.B
    alternate_source_declared_date: 2026-05-14
    alternate_source_id: letter-to-laodiceans
    alternate_source_file: content/translations/sources/letter-to-laodiceans/_source.yaml
    notes: |
      Searched at Π.1 (2026-05-14) for the Pauline Letter to the
      Laodiceans by scanning every page for 'መልእክት ... ሎዶቅያ'
      (Letter to Laodicea) and the related 'ዘወደ ሎዶቅያ' construction.
      ZERO opening-title matches found.

      The 4 pages containing 'ሎዶቅያ' are all secondary references:
        - page 2004: 'በሎዶቅያ ተጽፋ' ('written from Laodicea' —
                     subscript note at the end of another epistle)
        - page 2077: 'በሎዶቅያ' in the seven-churches list (Rev 1:11)
        - page 2080: 'መልኳከ ቤተ ከርስቲያን ዛዘሎዶቅያ' (Rev 3:14 angel-of-
                     the-Laodicean-church header — INSIDE Revelation,
                     not the Pauline Letter to the Laodiceans)
        - page 2284: 'ወበሎዶቅያ አርካቦስ' (geographic reference)

      The EOTC's parallel-Bible PDF used by this project does NOT
      include the Pauline Letter to the Laodiceans as a standalone
      book. The EOTC's NT canon as printed in this volume includes
      the standard 27-book NT only; the Letter to the Laodiceans is
      sometimes (but not consistently) included in the EOTC's
      broader canon (per Metzger 1987 §V "The Canon of the Ethiopian
      Church" pp. 220-221).

      Π.1 conclusion: the laodiceans (lao) slot remains DECLARED in
      this structural_map for future expansion BUT requires an
      ALTERNATE SOURCE.

      Π.1.B fulfillment (2026-05-14): the alternate source is now
      DECLARED in content/translations/sources/letter-to-laodiceans/
      _source.yaml. Primary anchor: J.B. Lightfoot 1875 (Saint Paul's
      Epistles to the Colossians and to Philemon, Appendix pp. 281-
      300, Latin text + English translation; PD-old; Lightfoot died
      1889). Secondary anchors: M.R. James 1924 (Apocryphal New
      Testament pp. 478-480, PD-old; James died 1936) + Codex
      Fuldensis 547 CE manuscript witness (PD-by-age) accessed via
      Lightfoot's transcription. Twenty-verse single-chapter
      division per Lightfoot 1875 (the standard reference division
      cited by Elliott 1993 + Ehrman 2003 + Metzger 1987). Acquisition
      remains gated on operator review + publisher authorization for
      broader-canon inclusion in default editions (per the
      `feedback_license_flagging` memory protocol).

