  # keyword typo ፅ-for-ዕ) — causing all verses to default to
  # chapter 1. The τ.6.x.1.D extension adds CHAPTER_HEADER_RE_LENIENT
  # (tolerates ፅ-for-ዕ in the keyword + Latin-letter/garbled-numeral
  # tokens + `=` for `።` as terminator) and _resolve_chapter_marker()
  # (Geʽez parsing → Arabic-digit extraction → sequential fallback;
  # with max-jump sanity check that rejects forward jumps > 5 chapters
  # as likely OCR garbles).
  tau6x1d_chapter_recovery:
    shipped_at_phase: τ.6.x.1.D
    shipped_date: 2026-05-15
    triggered_by: |
      user "τ.6.x.1.D" explicit phase invocation after τ.6.x.1.C
      shipping noted "chapter-marker recognition fails when OCR
      garbles the Ethiopic numeral" as the next-most-logical
      refinement before τ.7.x.a (proper).
