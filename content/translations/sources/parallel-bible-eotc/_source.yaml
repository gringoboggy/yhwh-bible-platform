      ልጆች መክከል በሲና ተራራ በሙሴ እጅ የሰጠው ቋግ ትእዛዝና ፍርድ ይሀ ው`
      ("These are the commandments which the LORD commanded Moses
      for the children of Israel on Mount Sinai") confirmed at
      page 212.

      End-boundary determined by Numbers transition at page 214:
      page 214 opens with `መጽሐፍ ይዘ ነው` ("This book is finished")
