# Translation metadata — τ.5-A JPS 1917 seed (2026-05-12).
#
# The Jewish Publication Society's 1917 Tanakh translation was the
# first Bible translation into English by a committee of Jewish
# scholars. The JPS 1917 is unambiguously Public Domain — all
# translators died well before the 1929 PD cutoff (Solomon Schechter
# 1915, Cyrus Adler 1940 last; the work itself was published 1917,
# explicitly placed in the public domain by JPS).
#
# τ.5-A ships the metadata + a 3-verse Genesis seed (Gen 1:1-3) to
# prove the wire-up — the full 39-book / ~23,000-verse OT ingest is
# τ.5-A.x's user-side deliverable (download eng-jps_vpl.zip from
# eBible.org, unzip into content/translations/sources/jps/, run
# `python scripts/extract_translation.py jps`).
#
# Paired with `wlc` (Westminster Leningrad Codex Hebrew) under
# τ.5-A. JPS provides the English-language channel; WLC provides
# the Hebrew-text channel. Together they close the Hebrew column
# for the 6 of 9 project editions that declare `hebrew` in
# popup_languages_default.

id: jps
title: "Jewish Publication Society Tanakh (1917)"
short_title: "JPS"
license: "Public Domain"
source:
  publisher: "Jewish Publication Society (Philadelphia, 1917)"
  url: "https://eBible.org/eng-jps/"
  package: "eng-jps_vpl.zip (user-side ingest — eBible.org)"
  fetched: 2026-05-12
  source_date: 1917
stats:
  books: 1            # seed only — Genesis
  verses: 3           # Gen 1:1-3 — canonical opening seed
  books_outside_kjv: 0
notes: |
  τ.5-A SEED CORPUS.

  This is a 3-verse seed (Genesis 1:1-3) that proves the
  translation-registry wire-up. Once the directory is present,
  `list_translations()` discovers `jps` automatically; the
  /customize console surfaces it as a selectable
  popup_translation; the /compare console renders it side-by-
  side with KJV and any other registered translations.

  The full 39-book / ~23,000-verse Tanakh ingest is τ.5-A.x's
  user-side deliverable. The eBible.org package
  `eng-jps_vpl.zip` is the canonical source; once downloaded
  into `content/translations/sources/jps/` and unzipped, the
  user runs `python scripts/extract_translation.py jps` to
  generate the per-book `gen.py` / `exo.py` / ... files.

  The JPS 1917 retains some archaic conventions (uses "Jehovah"
  for the Tetragrammaton in some contexts, "thou" / "thee"
  pronouns, semicolons for paragraph-internal pauses) but is
  significantly more accessible than KJV for Hebrew-Bible
  scholarship and is the conventional Jewish reference
  translation for English-speaking communities until JPS's 1985
  Tanakh (NJPS, NOT public domain) supplanted it.
