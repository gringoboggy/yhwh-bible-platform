notes: |
  Jewish Publication Society 1917 Tanakh — Public-Domain English translation of the Hebrew Bible. Closes the Hebrew column for the 6 of 9 editions that declare `hebrew` in popup_languages_default (ethiopian-tewahedo, catholic-study, jewish-study, scholarly-academic, anglican-bcp, lutheran-confessional). Pairs with the `wlc` (Westminster Leningrad Codex) consonantal Hebrew text — JPS provides the English-language channel; WLC provides the Hebrew-text channel. Phase τ.5-A ships infrastructure + Gen 1:1-3 seed; τ.5-A.x is the user-side full ingest (download eng-jps_vpl.zip, unzip into content/translations/sources/jps/, run this script). OT only — JPS is the Hebrew Bible, 39 books / ~23,000 verses.
