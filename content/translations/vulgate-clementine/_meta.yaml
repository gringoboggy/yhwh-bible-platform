notes: |
  Clementine Vulgate — Pope Clement VIII's 1592 authorized edition of Jerome's 4th-century Latin translation. Public Domain by age (Jerome died 420 AD; Clementine edition 1592). Closes the Latin column called for by the anglican-bcp edition in popup_languages_default. The Stuttgart Vulgate (Weber-Gryson, 1969+) is the modern critical alternative but is NOT public domain; the Clementine remains the canonical PD Latin Bible. τ.3 ships Gen 1:1-3 seed; τ.3.x is user-side full ingest. Both Testaments — full Catholic canon (~73 books, the Latin Vulgate covers slightly more than the Hebrew MT).
