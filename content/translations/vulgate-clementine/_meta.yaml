notes: |
  Clementine Vulgate — Pope Clement VIII's 1592 authorized edition of Jerome's 4th-century Latin translation. Public Domain by age (Jerome died 420 AD; Clementine edition 1592). Closes the Latin column called for by the anglican-bcp edition in popup_languages_default. The Stuttgart Vulgate (Weber-Gryson, 1969+) is the modern critical alternative but is NOT public domain; the Clementine remains the canonical PD Latin Bible. τ.3 ships Gen 1:1-3 seed; τ.3.x is user-side full ingest. Both Testaments — full Catholic canon (~73 books, the Latin Vulgate covers slightly more than the Hebrew MT).
  Phase E (2026-05-26): added the Latin deuterocanonical appendix — man (15 v), 1es (279 v), 2es (823 v) = +1,117 v, sourced from la.wikisource (the eBible package omits it), completing the Vulgate popup spine 74→77 books. The Clementine 1es/2es verse numbering diverges from the canonical KJV-Apocrypha scheme, so a verified per-chapter correction table aligns the Latin to canonical coordinates; three multi-shift name-list chapters (1es 5, 1es 8, 2es 14) are deferred (omitted, flagged) pending a dedicated alignment pass rather than aligned by guess. Verse-count totals reflect the aligned-and-shipped verses only.
