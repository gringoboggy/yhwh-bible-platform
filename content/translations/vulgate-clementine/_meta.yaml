notes: |
  τ.3 SEED CORPUS.

  This is a 3-verse seed (Genesis 1:1-3) that proves the
  translation-registry wire-up. Once the directory is present,
  `list_translations()` discovers `vulgate-clementine`
  automatically; the /customize console surfaces it as a
  selectable popup_translation; the /compare console renders
  it side-by-side with KJV, JPS, Brenton-LXX, etc.

  The full ingest is τ.3.x's user-side deliverable.

  Three Latin Vulgate editions to be aware of:

  - **Clementine** (1592, this one): the canonical PD Latin
    Bible. Used in the Tridentine Mass and most pre-Vatican-II
    Catholic liturgy. Aligned with the Greek LXX in OT
    versification.
  - **Stuttgart / Weber-Gryson** (1969+): modern critical
    edition, NOT public domain. Closer to Jerome's original
    text via manuscript collation but unavailable for PD
    distribution.
  - **Nova Vulgata** (1979, Vatican): the post-Vatican-II
    official edition. Also NOT public domain.

  For the publishing context, the Clementine is the right
  choice — it's both the most historically-significant Latin
  Bible AND the most accessible PD-licensed Latin text.

  Pairs with `douay-rheims` (τ.2) as the Catholic-tradition
  translation pair: vulgate-clementine is the Latin source;
  douay-rheims is the English translation OF that Latin.
  Future τ.3.x ingest unlocks side-by-side Latin / English
  in /compare for catholic-study + anglican-bcp.
