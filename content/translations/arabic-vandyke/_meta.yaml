notes: |
  τ.10-A SEED CORPUS.

  This is a 3-verse seed (Genesis 1:1-3) that proves the
  translation-registry wire-up. Once the directory is present,
  `list_translations()` discovers `arabic-vandyke` automatically;
  the /customize console surfaces it as a selectable
  popup_translation; the /compare console renders it side-by-
  side with all other registered translations.

  The full ingest is τ.10-A.x's user-side deliverable.

  Stylistic + canonical notes:

  - The Van Dyck is the Arabic Protestant Bible — covers the
    66-book Protestant canon (no deuterocanonicals). For the
    coptic-orthodox edition which uses the broader Eastern
    canon, a future τ-phase could add the Bagster Catholic
    Arabic Bible (19th-century, includes deuterocanonicals).
  - Right-to-left rendering: handled by ν.2.7's popup-languages
    machinery (same path as `wlc` Hebrew). The runtime UI
    respects `dir="rtl"` automatically when the language is
    declared in the edition's popup_languages_default.
  - Diacritical marks (tashkīl / harakāt — Unicode U+064B-U+065F)
    are included in the seed for vowel disambiguation;
    publishers who want unpointed Arabic can strip them via
    standard Unicode normalization (similar to the τ.5-B
    consideration for unpointed Hebrew).

  Pairs naturally with no specific "second half" the way
  Vulgate+DRA pair (Latin+English-of-Latin) or Brenton-Greek+
  Brenton-English pair (Greek+English-of-Greek). The Van Dyck
  is a standalone Arabic translation. Future τ-phases could
  add the Coptic-language text of the Bohairic Bible
  (canonical-Liturgical text of the Coptic Orthodox Church)
  to pair with the Van Dyck as Coptic+Arabic for the
  coptic-orthodox edition's tradition pair.

  After this ship: every declared popup_languages_default
  language across the 9 editions has at least seed coverage.
  The translation foundation is complete; subsequent τ-x.x
  user-side ingests fill in the body.
