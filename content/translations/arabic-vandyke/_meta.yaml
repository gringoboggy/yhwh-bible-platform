# Translation metadata — τ.10-A Arabic Van-Dyck-Boustani seed (2026-05-12).
#
# The Van Dyck–Boustani Arabic Bible (1865, Beirut) is the standard
# Protestant Arabic Bible, produced over 16 years by an American
# Bible Society / Syrian Mission team:
#
#   - Eli Smith (d. 1857)            — initial editor
#   - Cornelius Van Dyck (d. 1895)   — completed the translation
#   - Butrus al-Bustani (d. 1883)    — Arabic linguistic expertise
#   - Nasif al-Yaziji (d. 1871)      — Arabic style + grammar
#   - Yusuf al-Asir (d. 1889)        — final stylistic revisions
#
# All translators died before 1929; the 1865 Beirut edition itself
# is unambiguously Public Domain by age.
#
# Closes the Arabic column for the coptic-orthodox edition — the
# last popup-language gap after τ.5-A + γ.5 + τ.4 + τ.3 + τ.2
# closed the Hebrew + Greek + Latin + Greek-of-English channels.
#
# τ.10-A ships seed + metadata; τ.10-A.x is user-side full ingest
# from eBible.org's arb-vandyke_vpl.zip package.

