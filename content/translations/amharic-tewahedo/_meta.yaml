short_title: "Amharic"
license: "Public Domain / Tewahedo-tradition (PD basis pending τ.7.x ingest)"
source:
  publisher: "EOTC parallel Ge'ez-Amharic Bible (2025 scan, archive.org `EOTXC_HOLYSCRIPTS_ALL_BOOKS`) + nehemiah-osc.org modern Amharic (the v1 source)"
  url: "https://archive.org/details/EOTXC_HOLYSCRIPTS_ALL_BOOKS"
  package: "Bible_Amharic_and_Geez.pdf (parallel-Bible PDF) OR amh_vpl (eBible.org if available)"
  fetched: 2026-05-14
  source_date: null  # to be set during τ.7.x bulk ingest
