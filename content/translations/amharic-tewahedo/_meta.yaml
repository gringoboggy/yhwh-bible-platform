  books: 24           # 23 prior (… + jub τ.7.x.t) + 1en τ.7.x.u (The Book of Enoch / Mäṣḥafä Hēnok, p1515-1566 — SECOND of the two LARGE Π.1-mapped Tewahedo-distinctive books; BOTH large Tewahedo-distinctive books now ingested). sus still DEFERRED (present_in_pdf:false).
