notes: |
  Π.0 SEED CORPUS — 2026-05-14.

  This is a 3-verse seed (Genesis 1:1-3) that proves the
  translation-registry wire-up alongside the existing
  `geez-tewahedo` τ.6 seed. The two together prove the
  parallel-Bible popup-popup-popup stack works end-to-end at
  Genesis 1:1.

  Significance for the flagship:

  The ethiopian-tewahedo edition currently declares
  popup_languages_default = [english, hebrew, greek]. Adding
  `amharic` to that list is gated until τ.7.x produces full-
  Bible coverage; Π.0's seed makes the language registerable
  but does not yet surface it in production EPUBs.

  Unicode handling:

  - **Ethiopic** U+1200-U+137F: main syllabary (fidäl); covers
    standard Amharic text. Amharic uses the same Ethiopic script
    as Ge'ez but with the addition of seven Amharic-specific
    consonant series (ሸ ቸ ኘ ኸ ዠ ጀ ጨ) that do not exist in
    classical Ge'ez orthography.
  - Direction: left-to-right (matches Ge'ez; both differ from
    Hebrew/Arabic).
  - Numerals: Amharic typically uses Hindu-Arabic digits in
    modern publications, though Ethiopic numerals (፩ ፪ ፫ ...
    U+1369-U+137C) are sometimes preserved in scriptural texts.
    Verse numbering in this slot will normalize to Arabic
    digits for indexing while preserving the source rendering
    where present.

  Pairs naturally with:
  - `geez-tewahedo` (τ.6) — the classical-language parallel.
  - The Phase-1 v1 Meqabyan translation in `geez/translation.md`
    and `translation_continuation.md` — both were sourced from
    modern Amharic.
  - The 6 Tewahedo-distinctive books (1en, jub, mq1, mq2, mq3,
    lao) — the parallel-Bible's Amharic column gives an
    independent Amharic witness for these books beyond the
    nehemiah-osc.org source v1 used.
