notes: |
  Π.0 SEED CORPUS — 2026-05-14.

  This is a 3-verse seed (Genesis 1:1-3) that proves the
  translation-registry wire-up alongside the existing
  `geez-tewahedo` τ.6 seed. The two together prove the
  parallel-Bible popup-popup-popup stack works end-to-end at
  Genesis 1:1.

  Significance for the flagship (CORRECTED 2026-05-16 — the
  popup-only framing below was superseded; authoritative end-state
  is dev/SCOPE_2026-05-16-parallel-bible-standalone-bibles.md +
  CLAUDE_PROJECT_RULES §1):

  END GOAL: a STANDALONE Amharic Bible — its own books and
  chapters — carrying a faithful English back-translation of its
  ACTUAL Amharic wording in ITS OWN verse popups. This slot is
  NOT a popup-language slot for the other editions. Policy: the
  other 9 editions get NO `amharic` popups; the existing English
  `ethiopian-tewahedo` edition only conditionally (permitted ONLY
  on full per-verse-count parity across all books/chapters — a
  maybe, not a commitment). Do NOT wire `amharic` into any
  edition's popup_languages_default / popup_translation. The
  τ.7.x.* per-book ingests are the rendering FOUNDATION for the
  standalone Amharic Bible; constituting the standalone edition +
  the English back-translation are explicit POST-rendering phases
  (do not pull forward). Amharic text is used as-written-in-the-
  parallel-Bible-PDF, cited to that source.

  [Historical, superseded] Π.0's seed made the language
  registerable; earlier framing treated `amharic` as a verse-
  popup language gated on full coverage — that is no longer the
  goal.

  Unicode handling:

  - **Ethiopic** U+1200-U+137F: main syllabary (fidäl); covers
    standard Amharic text. Amharic uses the same Ethiopic script
    as Ge'ez but with the addition of seven Amharic-specific
    consonant series (ሸ ቸ ኘ ኸ ዠ ጀ ጨ) that do not exist in
    classical Ge'ez orthography.
  - Direction: left-to-right (matches Ge'ez; both differ from
    Hebrew/Arabic).
  - Numerals: Amharic typically uses Hindu-Arabic digits in
    modern publications, though Ethiopic numerals (፩ ፪ ፫ ...
    U+1369-U+137C) are sometimes preserved in scriptural texts.
    Verse numbering in this slot will normalize to Arabic
    digits for indexing while preserving the source rendering
    where present.

  Pairs naturally with:
  - `geez-tewahedo` (τ.6) — the classical-language parallel.
  - The Phase-1 v1 Meqabyan translation in `geez/translation.md`
    and `translation_continuation.md` — both were sourced from
    modern Amharic.
  - The 6 Tewahedo-distinctive books (1en, jub, mq1, mq2, mq3,
    lao) — the parallel-Bible's Amharic column gives an
    independent Amharic witness for these books beyond the
    nehemiah-osc.org source v1 used.
