# kinds.yaml v2 — registry of commentary note kinds.
#
# Each kind has:
#   code         — short stable identifier used in note tuples
#   category     — id from categories.yaml (lang, text, xref, hist, lit, comm,
#                  compare, dev, liturgy, apol, modern, ped, vis, dist)
#   symbol       — inline marker glyph (default: inherits from category)
#   note_class   — CSS class for the rendered <aside> body
#   marker_class — CSS class for the inline marker
#   label        — short label shown next to the marker
#   title_attr   — HTML title= attribute / hover tooltip
#   description  — author-facing guidance: when to use this kind
#   phase        — "legacy" | "mvp" | "phase2" | "phase3"
#
# Legacy codes (word, comm, source, parallel) are preserved verbatim for
# backward compatibility with the existing 1,371 notes. New kinds use
# category-prefixed codes (lang-hebrew, comm-patristic, etc.).
#
# Authors can use either form: `comm` for a generic note, `comm-patristic`
# when the note specifically represents a patristic-tradition reading.

