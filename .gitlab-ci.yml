# .gitlab-ci.yml — YHWH v2.4 continuous integration.
#
# Restored alongside the git remote on 2026-05-30 (mint-5). Mirrors the local
# gate `python scripts/ci.py` (W4.5) so CI and `make ci` enforce the SAME rules:
#   ruff format --check + ruff check + pip-audit + vulture + lint_rules.py + mypy
#   (+ pytest + coverage floor in the full run).
#
#   gate       — BLOCKING fast gate (scripts/ci.py --no-tests): format · lint ·
#                rules · mypy. Deterministic; runs on every push; the required
#                green signal HERE.
#   tests-core — pytest -m "not slow" (BLOCKING when it runs). Schedule/manual
#                only: this GitLab project is PRIVATE (400 compute-min/month) and
#                the old per-push `tests` job hit the 1-hour job timeout on EVERY
#                run (scripts/ci.py runs the full suite twice — plain, then again
#                under coverage) and burned the whole June quota
#                (ci_quota_exceeded from ~2026-06-06; no `tests` run was EVER
#                green — round-7 laundry verification, 2026-06-10).
#   tests-full — full scripts/ci.py (suite incl. slow builds + coverage floor +
#                epubcheck/JRE smokes). allow_failure UNTIL one green run proves
#                the clean-runner environment (deliberately visible — not a
#                silent skip); flip it then.
#
# The always-on per-push TEST signal lives in GitHub Actions instead
# (.github/workflows/tests.yml): the GitHub mirror is public, so its minutes are
# free, while every minute here draws down the private-namespace quota.
#
# ⚠ PER-PUSH PIPELINES DISABLED (2026-06-14): the private namespace hit
# `ci_quota_exceeded` (~2026-06-06), so EVERY push spawned a pipeline the runner
# refused before start (empty trace, status=failed) → a "failed pipeline" email
# on every push — pure noise, unrelated to the code. The GitHub Actions mirror
# is the real per-push CI (public repo = free minutes), so GitLab per-push CI is
# redundant. The `workflow:rules` below stop GitLab from creating ANY pipeline on
# push; the gate + test jobs still run on demand (CI/CD -> Run pipeline) or on a
# schedule — usable once the monthly quota resets or the project is made public.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(schedule|web|api|trigger)$/'
    - when: never

default:
  image: python:3.13-slim
  interruptible: true
  before_script:
    - python --version
    - pip install -r requirements.txt -r requirements-dev.txt
  cache:
    key: "pip-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip

variables:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

stages:
  - gate
  - test

gate:
  stage: gate
  script:
    - python scripts/ci.py --no-tests

# Both test jobs are schedule/manual-only (quota: see header). Trigger from the
# UI (CI/CD → Pipelines → New pipeline) or a pipeline schedule.
tests-core:
  stage: test
  timeout: 55m
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(schedule|web|api|trigger)$/'
  script:
    - python -m pytest -q -m "not slow"

tests-full:
  stage: test
  timeout: 3h
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(schedule|web|api|trigger)$/'
  script:
    - python scripts/ci.py
