# Ethiopian Tewahedo Bible EPUB — codebase configuration.
#
# Ruff handles both linting and formatting. Run:
#   ruff check .          # find issues
#   ruff check --fix .    # apply auto-fixable
#   ruff format .         # normalise style
#
# Style decisions:
#   - Line length 100 (black-default 88 is tight; 100 catches real outliers
#     while leaving long HTML-string templates untouched).
#   - Double quotes throughout (PEP 8 / black default).
#   - 4-space indent.
#   - sys.path manipulation pattern is permitted before project imports
#     (E402 silenced inside scripts/ and source_archive/ where this is the
#     established pattern).

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    "epub_working",
    "content/notes.backup_*",
    "scripts.backup_*",
    "source_archive.backup_*",
    "_audit_state.json",
    # vulture / cache-audit whitelist stubs: `_.attr` bare statements are the
    # tool's "treat-as-used" idiom (see each file's docstring), not runnable
    # source — linting them yields only false-positive F821 (undefined `_`).
    ".vulture_whitelist.py",
    ".cache_audit_whitelist.py",
]

[tool.ruff.lint]
# Pyflakes (F), pycodestyle (E, W), bugbear (B), pyupgrade (UP),
# flake8-simplify (SIM), pep8-naming (N), mccabe complexity (C90).
select = ["E", "W", "F", "B", "UP", "SIM", "N", "C90"]
# Allow long lines in docstrings/comments at the module level (we sometimes
# embed example HTML which breaks across lines awkwardly).
ignore = []
# Mccabe complexity threshold — default 10 is reasonable; some legacy
# functions in source_archive/ exceed this and are flagged.
mccabe.max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# `sys.path.insert(0, REPO_ROOT)` before project imports is the established
# bootstrap pattern in CLI entry-points (audit.py at root has all imports
# at the top of the file, so it does not need this exemption).
"scripts/*.py" = ["E402"]
"source_archive/*.py" = ["E402"]
# phase_c9_expansion.py is a data dump — note bodies are inherently 400+
# characters and cannot meaningfully be wrapped.
"source_archive/phase_c9_expansion.py" = ["E402", "E501"]
# scripts/build_edition.py contains: (1) embedded HTML template strings
# (copyright page + reading-plans front-matter + credits) whose <p> lines
# exceed 120 chars by design — splitting them is either a no-op for HTML
# rendering or an active regression for the published EPUBs;
# (2) three load-bearing orchestration functions — filter_books_for_canon
# (config-driven canonical-book filter with tradition + phase + kind +
# popup-language rule fans) + build_one (the full EPUB-build pipeline
# from corpus filter through OPF + NCX + epub.zip) + main (CLI entry
# delegating to build_one) — whose cyclomatic complexity reflects
# inherent build-pipeline orchestration cohesion and would lose semantic
# clarity if forcibly split. Codified at ω.4x hygiene bundle
# (2026-05-14) per AUDIT_2026-05-14-LIGHT-2 W-W2 finding.
"scripts/build_edition.py" = ["E402", "E501", "C901"]
# scripts/inject.py: inject_book (strategy-dispatched verse-region location
# + marker/aside insertion with verse-end fallback) and main (per-book CLI
# aggregation) are inherently-complex inject-pipeline orchestration — the
# same category as build_edition.py above. Splitting them would scatter
# cohesive pipeline logic for no readability gain, so C901 is ignored here.
"scripts/inject.py" = ["E402", "C901"]
# scripts/templates/*.py are console HTML template modules — each is one giant
# r"""...""" HTML string constant. E501 (line-too-long) is intrinsic to embedded
# HTML (Tailwind class lists, inline styles, data-* attributes); wrapping those
# lines is a no-op or an active regression for the rendered page. (The other
# rules still apply — only E501 is exempt here.) Codified at the Track-D Tier-4
# config pass, 2026-05-22 (conservative scope: only this unambiguously-inherent
# case is masked; C901/SIM105/N8xx stay visible as honest backlog).
"scripts/templates/*.py" = ["E501"]
# content/notes/*.py are pure data files — every entry is a tuple containing
# a long HTML body string. E501 (line-too-long) is intrinsic to the format.
# N999 (invalid module name) fires on books like "1ch.py" / "2ki.py" because
# Python module names cannot start with a digit; the project loads these
# explicitly via importlib so the strict naming rule is moot.
"content/notes/*.py" = ["E501", "N999"]
# kings_session/ is legacy code retained as a fallback. Some files predate
# the modern style sweep and use the same long-data-tuple pattern as
# content/notes/.
"kings_session/*.py" = ["E402", "E501", "N999"]
"kings_session/**/*.py" = ["E402", "E501", "N999"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false
skip-magic-trailing-comma = false

# ω.31 — mypy configuration. Conservative defaults: scope to scripts/core/
# initially (the most disciplined corner of the codebase). The wider sweep
# happens in future ω.31.x as call-site annotations land. `ignore_missing_
# imports = true` papers over PyYAML / pywebview / pyinstaller stubs we
# don't care to chase.
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
# Don't fail on optional fields not yet annotated. Tightening to
# strict_optional + no_untyped_defs is a future ω.31.x decision once the
# call sites have annotations.
check_untyped_defs = false
disallow_untyped_defs = false
strict_optional = false
# Per-package overrides — start from scripts/core/ and expand outward.
files = ["scripts/core", "scripts/build_edition.py"]

[[tool.mypy.overrides]]
module = "scripts.*"
ignore_errors = false

# ω.34 — pytest configuration. Default invocation `pytest` runs
# everything serially. For faster local iteration, use:
#
#     pytest -n auto --dist=loadfile
#
# `loadfile` keeps every test in the same file on the same worker —
# tests in `tests/test_scripts.py` (the YAML-mutator monolith) all
# run on one worker, eliminating intra-file races on the shared
# `content/editions.yaml` and other shared state. Other test files
# (`test_core.py`, `test_audit_*`, etc.) parallelise across workers.
# Empirically: 219s → ~60s wall-time on a 6-core laptop.
[tool.pytest.ini_options]
markers = [
    "serial: test must run serially (mutates shared on-disk state — content/editions.yaml, scenarios, etc.)",
]
# pytest-xdist's `loadfile` distribution is the right default IF
# `-n` is passed. We don't make `-n auto` the default itself — it
# changes output formatting in ways that hurt single-test debug.
# Devs opt in: `pytest -n auto --dist=loadfile`.
filterwarnings = [
    # Tolerate the `\` SyntaxWarnings emitted by `content/notes/*.py`
    # PD-source bodies. These are data files; rewriting backslashes
    # in 50K notes is not the right cost/benefit.
    "ignore::SyntaxWarning",
]
